name: Tauri and Nuitka build

# An experiment beside Hoard's own releases: the same Hoard, with its window from a Tauri shell (shell/) instead of
# pywebview, and its server compiled by Nuitka (scripts/build_nuitka.py) instead of packed by PyInstaller, for
# Windows, macOS and Linux, to compare with the usual build.
#
# Every push to claude/tauri-nuitka builds it. shell/RELEASE says which experiment it is (n): while
# tauri-nuitka-beta.<n> isn't published yet, the push releases it, as release.yml releases the app: a draft, each
# file attached, VirusTotal's scan, then a pre-release, never Latest, its tag made on this push's commit as it's
# published (a tag pushed by hand releases too). A file VirusTotal flags leaves the draft for a person to look at.
# Once it's published, pushes only build (the files are kept with the run, under Artifacts); the next number in
# shell/RELEASE makes the next one. Hoard's updates only look at its version tags (v...), and Tidy releases leaves
# other tags alone, so this build is never offered to anyone: it's downloaded from its release.
#
# Linux has an AppImage, a .deb and a Flatpak (shell/flatpak: the .deb's files on the GNOME runtime, with the app ID
# the earlier Flatpak had, so it installs over that one).
#
# Updates: with the repository secret TAURI_SIGNING_PRIVATE_KEY (and its _PASSWORD), a release's files that Tauri's
# updater installs are signed with it, each once it's final, and listed with their signatures in Hoard-update.json,
# the file Hoard's window updates from (hoard/updater.py chooses the release; shell/src/main.rs checks the file against
# shell/updater.pub, the key's public half, and installs it). The key and shell/updater.pub must agree: a release with
# one and not the other stops before anything is built.
#
# Windows' programs and setup are signed as release.yml signs them (Azure Artifact Signing, in the release-signing
# environment), for a release only. The Mac's aren't signed, as the usual Mac app isn't. Every action is pinned to
# an exact commit, Python's packages and Nuitka by their hashes (requirements*.txt), the Tauri CLI by its lockfile
# (shell/package-lock.json) and the Rust crates by shell/Cargo.lock.

on:
  push:
    branches: ["claude/tauri-nuitka"]
    tags: ["tauri-nuitka-beta.*"]

permissions: {}

concurrency:
  group: tauri-nuitka-${{ github.ref }}

jobs:
  # Whether this push releases, and as which tag: a tag pushed by hand, or shell/RELEASE's while it isn't published
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # the draft release
    outputs:
      release: ${{ steps.plan.outputs.release }}
      tag: ${{ steps.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: The updates' key and the window's public half agree
        env:
          HAS_UPDATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
        run: |
          if [ -s shell/updater.pub ] && [ "$HAS_UPDATE_KEY" != "true" ]; then
            echo "::error::shell/updater.pub has the updates' public key, but the TAURI_SIGNING_PRIVATE_KEY secret isn't set: the window would wait for signed updates that are never made."
            exit 1
          fi
          if [ ! -s shell/updater.pub ] && [ "$HAS_UPDATE_KEY" = "true" ]; then
            echo "::error::The TAURI_SIGNING_PRIVATE_KEY secret is set, but shell/updater.pub is empty: put the key's public half there."
            exit 1
          fi

      - name: Is this a release?
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            tag="$GITHUB_REF_NAME"
          else
            n=$(tr -dc '0-9' < shell/RELEASE)
            [ -n "$n" ] || { echo "::error::shell/RELEASE should hold the experiment's number."; exit 1; }
            tag="tauri-nuitka-beta.$n"
          fi
          draft=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null || echo none)
          if [ "$draft" = "false" ]; then
            echo "$tag is published already: this push only builds (the next number in shell/RELEASE makes the next)."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Make the release (a draft until every file is attached)
        if: steps.plan.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.plan.outputs.tag }}
        run: |
          version=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' hoard/__init__.py)
          words=$(echo "$version" | sed 's/-beta\./ beta /')
          sed "s/{version}/$version/g" shell/RELEASE_NOTES.md > notes.md
          title="Hoard $words, Tauri and Nuitka (experiment ${TAG##*.})"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release edit "$TAG" --title "$title" --notes-file notes.md --prerelease --repo "$GITHUB_REPOSITORY"
          elif [ "$GITHUB_REF_TYPE" = "tag" ]; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$title" --notes-file notes.md \
              --prerelease --latest=false --verify-tag --draft
          else   # (the tag is made on this commit when the draft is published)
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$title" --notes-file notes.md \
              --prerelease --latest=false --target "$GITHUB_SHA" --draft
          fi

  build:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, name: windows, bundles: nsis }
          - { os: macos-15, name: macos-apple-silicon, bundles: "app,dmg" }
          - { os: macos-15-intel, name: macos-intel, bundles: "app,dmg" }
          - { os: ubuntu-22.04, name: linux, bundles: "appimage,deb" }   # (22.04: the AppImage runs on older systems too)
    runs-on: ${{ matrix.os }}
    environment: ${{ (matrix.name == 'windows' && needs.release.outputs.release == 'true') && 'release-signing' || '' }}
    permissions:
      contents: write        # add the files to the release
      id-token: write        # sign the build provenance, and sign in to Azure to sign the programs
      attestations: write   # store the provenance with the repository
    env:
      TAG: ${{ needs.release.outputs.tag }}
      RELEASE: ${{ needs.release.outputs.release }}
      # (not SIGN: linuxdeploy's AppImage plugin reads that, and signs the AppImage with GPG if it's set to anything)
      SIGN_WINDOWS: ${{ matrix.name == 'windows' && needs.release.outputs.release == 'true' && vars.AZURE_SIGNING_ACCOUNT != '' }}
      SIGN_UPDATES: ${{ needs.release.outputs.release == 'true' && secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: What Tauri and Nuitka need on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Install the locked dependencies and Nuitka (every file hash-checked)
        run: python -m pip install --disable-pip-version-check --require-hashes -r requirements.txt -r requirements-nuitka.txt

      - name: Compile Hoard's server with Nuitka
        run: python scripts/build_nuitka.py

      - name: Check the server has everything it needs
        run: build/nuitka/server/hoard-server self-test

      - name: Sign in to Azure, to sign the programs
        if: env.SIGN_WINDOWS == 'true'
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Issue #327: Windows Defender took experiment 2 for a trojan. Its server folder held hoard-server.exe, signed,
      # beside a great many libraries Nuitka compiled (.dll, .pyd) that weren't: every one of those is signed now too.
      # Libraries already signed by whoever made them (Python's, Microsoft's) are left as they are.
      - name: List the server's programs and libraries that aren't signed yet
        if: env.SIGN_WINDOWS == 'true'
        id: unsigned
        shell: pwsh
        run: |
          $files = Get-ChildItem build\nuitka\server -Recurse -File -Include *.exe, *.dll, *.pyd |
            Where-Object { (Get-AuthenticodeSignature $_.FullName).Status -eq "NotSigned" }
          "{0} of the server's files to sign" -f @($files).Count
          $end = "END_" + [guid]::NewGuid().ToString("N")
          Add-Content $env:GITHUB_OUTPUT "files<<$end"
          $files | ForEach-Object { Add-Content $env:GITHUB_OUTPUT $_.FullName }
          Add-Content $env:GITHUB_OUTPUT $end

      - name: Sign hoard-server.exe and its libraries
        if: env.SIGN_WINDOWS == 'true'
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_SIGNING_PROFILE }}
          files: ${{ steps.unsigned.outputs.files }}
          description: Hoard
          description-url: https://github.com/${{ github.repository }}
          exclude-environment-credential: true
          exclude-workload-identity-credential: true
          exclude-managed-identity-credential: true
          exclude-shared-token-cache-credential: true
          exclude-visual-studio-credential: true
          exclude-visual-studio-code-credential: true
          exclude-azure-cli-credential: false        # the sign-in above
          exclude-azure-powershell-credential: true
          exclude-azure-developer-cli-credential: true
          exclude-interactive-browser-credential: true

      - name: The Tauri CLI (its lockfile's, every file hash-checked)
        working-directory: shell
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Build the window (Hoard, with the server in its resources)
        working-directory: shell
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          numbers=$(python -c "import re; v=open('../hoard/__init__.py').read(); print('.'.join(re.findall(r'\d+', re.search(r'__version__ = \"([^\"]+)\"', v).group(1))[:3]))")
          echo "NUMBERS=$numbers" >> "$GITHUB_ENV"
          npx tauri build --no-bundle --config "{\"version\": \"$numbers\"}"

      - name: Sign Hoard.exe
        if: env.SIGN_WINDOWS == 'true'
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_SIGNING_PROFILE }}
          files: ${{ github.workspace }}\shell\target\release\Hoard.exe
          description: Hoard
          description-url: https://github.com/${{ github.repository }}
          exclude-environment-credential: true
          exclude-workload-identity-credential: true
          exclude-managed-identity-credential: true
          exclude-shared-token-cache-credential: true
          exclude-visual-studio-credential: true
          exclude-visual-studio-code-credential: true
          exclude-azure-cli-credential: false
          exclude-azure-powershell-credential: true
          exclude-azure-developer-cli-credential: true
          exclude-interactive-browser-credential: true

      - name: Make the installer
        working-directory: shell
        env:   # (Linux: linuxdeploy's strip can't read newer libraries, and its tools run unpacked, without FUSE)
          NO_STRIP: "true"
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          npx tauri bundle --verbose --bundles ${{ matrix.bundles }} --config "{\"version\": \"$NUMBERS\"}"

      - name: Name the files, and list their checksums
        run: |
          version=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' hoard/__init__.py)
          mkdir -p dist
          b=shell/target/release/bundle
          case "${{ matrix.name }}" in
            windows) cp $b/nsis/*-setup.exe "dist/Hoard-Tauri-Setup-$version.exe" ;;
            macos-*) cp $b/dmg/*.dmg "dist/Hoard-Tauri-$version-${{ matrix.name }}.dmg"
                     # (what the updater installs on a Mac: the app itself, replaced where it is)
                     tar -C $b/macos -czf "dist/Hoard-Tauri-$version-${{ matrix.name }}.app.tar.gz" Hoard.app ;;
            linux)   cp $b/appimage/*.AppImage "dist/Hoard-Tauri-$version-linux-x86_64.AppImage"
                     cp $b/deb/*.deb "dist/Hoard-Tauri-$version-linux-amd64.deb" ;;
          esac
          cd dist
          python -c "import hashlib, pathlib; print(''.join(f'{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.name}\n' for p in sorted(pathlib.Path('.').iterdir()) if p.is_file()), end='')" > "SHA256SUMS-tauri-${{ matrix.name }}.txt"
          cat "SHA256SUMS-tauri-${{ matrix.name }}.txt"
          ls -la

      - name: Sign the installer
        if: env.SIGN_WINDOWS == 'true'
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}\dist
          files-folder-filter: exe
          description: Hoard setup
          description-url: https://github.com/${{ github.repository }}
          exclude-environment-credential: true
          exclude-workload-identity-credential: true
          exclude-managed-identity-credential: true
          exclude-shared-token-cache-credential: true
          exclude-visual-studio-credential: true
          exclude-visual-studio-code-credential: true
          exclude-azure-cli-credential: false
          exclude-azure-powershell-credential: true
          exclude-azure-developer-cli-credential: true
          exclude-interactive-browser-credential: true

      - name: Check every signature, as Windows sees it, and the setup's checksum after signing
        if: env.SIGN_WINDOWS == 'true'
        shell: pwsh
        run: |
          $files = @(Get-Item build\nuitka\server\hoard-server.exe, shell\target\release\Hoard.exe) + @(Get-ChildItem dist\*.exe)
          foreach ($f in $files) {
            $sig = Get-AuthenticodeSignature $f.FullName
            "{0}: {1}, {2}" -f $f.Name, $sig.Status, $sig.SignerCertificate.Subject
            if ($sig.Status -ne "Valid") { Write-Output "::error::$($f.Name) isn't validly signed ($($sig.Status))"; exit 1 }
          }
          # the server's libraries (issue #327): none left unsigned; one its maker signed that Windows can't check is said
          $libraries = Get-ChildItem build\nuitka\server -Recurse -File -Include *.dll, *.pyd
          "{0} libraries in the server's folder" -f @($libraries).Count
          foreach ($f in $libraries) {
            $sig = Get-AuthenticodeSignature $f.FullName
            if ($sig.Status -eq "NotSigned") { Write-Output "::error::$($f.Name) isn't signed"; exit 1 }
            if ($sig.Status -ne "Valid") { Write-Output "::warning::$($f.Name): $($sig.Status), $($sig.SignerCertificate.Subject)" }
          }
          Get-ChildItem dist\*.exe | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash $_ -Algorithm SHA256).Hash.ToLower(), $_.Name } | Set-Content dist\SHA256SUMS-tauri-windows.txt

      # Each file the updater installs, signed once it's final (Windows' after Authenticode, which changes it), and
      # its part of Hoard-update.json: what Tauri's updater looks up for this system, the file's address and signature
      - name: Sign the updates
        if: env.SIGN_UPDATES == 'true'
        working-directory: shell
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          case "${{ matrix.name }}" in
            windows)             files=(../dist/Hoard-Tauri-Setup-*.exe); keys=("windows-x86_64 windows-x86_64-nsis") ;;
            macos-apple-silicon) files=(../dist/*.app.tar.gz); keys=("darwin-aarch64 darwin-aarch64-app") ;;
            macos-intel)         files=(../dist/*.app.tar.gz); keys=("darwin-x86_64 darwin-x86_64-app") ;;
            linux)               files=(../dist/*.AppImage ../dist/*.deb)
                                 keys=("linux-x86_64 linux-x86_64-appimage" "linux-x86_64-deb") ;;
          esac
          mkdir -p ../update
          for i in "${!files[@]}"; do
            npx tauri signer sign "${files[$i]}"
            for key in ${keys[$i]}; do
              printf '%s\t%s\t%s\n' "$key" "$(basename "${files[$i]}")" "$(cat "${files[$i]}.sig")" >> "../update/update-${{ matrix.name }}.tsv"
            done
            rm "${files[$i]}.sig"
          done
          cut -f1,2 "../update/update-${{ matrix.name }}.tsv"

      - name: Keep this system's part of Hoard-update.json
        if: env.SIGN_UPDATES == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: update-${{ matrix.name }}
          path: update/
          retention-days: 3
          if-no-files-found: error

      - name: Keep the .deb, for the Flatpak
        if: matrix.name == 'linux'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hoard-tauri-deb
          path: dist/*.deb
          retention-days: 3
          if-no-files-found: error

      - name: Sign build provenance
        if: env.RELEASE == 'true' && !github.event.repository.private
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/Hoard-Tauri-*

      - name: Add them to the release
        if: env.RELEASE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber

      - name: Keep them with this run (a push to the branch)
        if: env.RELEASE != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hoard-tauri-${{ matrix.name }}
          path: dist/
          retention-days: 14
          if-no-files-found: error

  # The Flatpak (shell/flatpak): the .deb's files on the GNOME runtime, as a bundle. Its build checks every library the
  # window needs is in the runtime, and runs the server's self-test inside the sandbox.
  flatpak:
    needs: [release, build]
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51@sha256:78d969b18225ae107ca29497bf09c4a3f791e5f1838a9a912a529d0024fb6210
      options: --privileged
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: hoard-tauri-deb
          path: deb
      - name: The .deb, where the manifest takes it from
        run: mv deb/*.deb shell/flatpak/hoard.deb && rm -r deb
      - uses: flatpak/flatpak-github-actions/flatpak-builder@79327416609af08178ad73b352877e51450790b3 # v6.8
        with:
          manifest-path: shell/flatpak/io.github.soloflighter1010.Hoard.yml
          bundle: Hoard.flatpak
          artifact-name: hoard-tauri-flatpak
          cache: false

  # The build's container has no gh, so the bundle is added to the release from here.
  flatpak-release:
    needs: [release, flatpak]
    if: needs.release.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write        # add the bundle to the release
      id-token: write        # sign the build provenance
      attestations: write   # store the provenance with the repository
    env:
      TAG: ${{ needs.release.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: hoard-tauri-flatpak
          path: dist
      - name: Name it by its version, and checksum it
        run: |
          version=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' hoard/__init__.py)
          cd dist
          mv *.flatpak "Hoard-Tauri-$version-linux-x86_64.flatpak"
          sha256sum Hoard-Tauri-*.flatpak > SHA256SUMS-tauri-flatpak.txt
          cat SHA256SUMS-tauri-flatpak.txt
      - name: Sign build provenance
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/Hoard-Tauri-*.flatpak
      - name: Add it to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber

  # Hoard-update.json, from each system's part: what Hoard's window updates from (Tauri's updater's own format).
  # Only when the updates' key is there; without it, the window doesn't update itself, and Hoard says where to go.
  update-manifest:
    needs: [release, build]
    if: needs.release.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write        # add it to the release
    env:
      TAG: ${{ needs.release.outputs.tag }}
      HAS_UPDATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.HAS_UPDATE_KEY == 'true'
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: env.HAS_UPDATE_KEY == 'true'
        with:
          pattern: update-*
          path: update
          merge-multiple: true
      - name: Make Hoard-update.json, and add it to the release
        if: env.HAS_UPDATE_KEY == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/update_manifest.py update "$TAG" > Hoard-update.json
          cat Hoard-update.json
          gh release upload "$TAG" Hoard-update.json --repo "$GITHUB_REPOSITORY" --clobber
      - name: No key, no Hoard-update.json
        if: env.HAS_UPDATE_KEY != 'true'
        run: echo "::notice::No TAURI_SIGNING_PRIVATE_KEY secret, so this release has no Hoard-update.json, and its window doesn't update itself."

  # As release.yml: every file is checked by VirusTotal before the release is published, and the results go in its
  # notes. A file an engine flags fails this, and the release stays a draft for a person to look at.
  virustotal:
    needs: [release, build, flatpak-release, update-manifest]
    if: needs.release.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write        # read the draft's files, and add the results to its notes
    env:
      TAG: ${{ needs.release.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Get the draft's files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir dist --clobber

      - name: Scan them with VirusTotal
        env:
          VT_API_KEY: ${{ secrets.VT_API_KEY }}   # only this step sees the key
        run: python3 scripts/scan_release_virustotal.py

      - name: Keep any flagged files, for a false-positive report
        if: ${{ always() && hashFiles('dist/VT_FLAGGED.txt') != '' }}
        working-directory: dist
        run: |
          mapfile -t flagged < VT_FLAGGED.txt
          zip -j -P infected "../flagged-$TAG.zip" "${flagged[@]}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ always() && hashFiles('dist/VT_FLAGGED.txt') != '' }}
        with:
          name: virustotal-flagged-files (zip password infected)
          path: flagged-${{ env.TAG }}.zip
          retention-days: 30
          if-no-files-found: error

      - name: Add the results to the release notes
        if: ${{ always() && hashFiles('dist/VT_REPORT.md') != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body > dist/NOTES.md
          python3 scripts/scan_release_virustotal.py --notes dist/NOTES.md dist/VT_REPORT.md
          gh release edit "$TAG" --notes-file dist/NOTES.md --repo "$GITHUB_REPOSITORY"

  # Last: publishing makes the release immutable. A pre-release, never Latest.
  publish:
    needs: [release, build, flatpak-release, update-manifest, virustotal]
    if: needs.release.outputs.release == 'true' && !failure() && !cancelled()
    runs-on: ubuntu-latest
    permissions:
      contents: write        # publish the draft
    env:
      TAG: ${{ needs.release.outputs.tag }}
    steps:
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$TAG" --draft=false --prerelease --latest=false --repo "$GITHUB_REPOSITORY"
