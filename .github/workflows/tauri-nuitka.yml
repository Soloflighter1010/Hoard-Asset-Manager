name: Tauri and Nuitka build

# An experiment beside Hoard's own releases: the same Hoard, with its window from a Tauri shell (shell/) instead of
# pywebview, and its server compiled by Nuitka (scripts/build_nuitka.py) instead of packed by PyInstaller, for
# Windows, macOS and Linux, to compare with the usual build.
#
# Every push to claude/tauri-nuitka builds it (the files are kept with the run, under Artifacts). Pushing a
# tauri-nuitka-beta.<n> tag releases it, as release.yml releases the app: a draft, each file attached, VirusTotal's
# scan, then a pre-release, never Latest. A file VirusTotal flags leaves the draft for a person to look at. Hoard's
# updates only look at its version tags (v...), and Tidy releases leaves other tags alone, so this build is never
# offered to anyone: it's downloaded from its release.
#
# Windows' programs and setup are signed as release.yml signs them (Azure Artifact Signing, in the release-signing
# environment), for a release only. The Mac's aren't signed, as the usual Mac app isn't. Every action is pinned to
# an exact commit, Python's packages and Nuitka by their hashes (requirements*.txt), the Tauri CLI by its lockfile
# (shell/package-lock.json) and the Rust crates by shell/Cargo.lock.

on:
  push:
    branches: ["claude/tauri-nuitka"]
    tags: ["tauri-nuitka-beta.*"]

permissions: {}

concurrency:
  group: tauri-nuitka-${{ github.ref }}

jobs:
  release:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write        # the draft release
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Make the release (a draft until every file is attached)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' hoard/__init__.py)
          words=$(echo "$version" | sed 's/-beta\./ beta /')
          sed "s/{version}/$version/g" shell/RELEASE_NOTES.md > notes.md
          title="Hoard $words, Tauri and Nuitka (experiment ${TAG##*.})"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release edit "$TAG" --title "$title" --notes-file notes.md --prerelease --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$title" --notes-file notes.md \
              --prerelease --latest=false --verify-tag --draft
          fi

  build:
    needs: release
    if: ${{ !failure() && !cancelled() }}   # (a push to the branch has no release: it builds all the same)
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, name: windows, bundles: nsis }
          - { os: macos-15, name: macos-apple-silicon, bundles: "app,dmg" }
          - { os: macos-15-intel, name: macos-intel, bundles: "app,dmg" }
          - { os: ubuntu-22.04, name: linux, bundles: "appimage,deb" }   # (22.04: the AppImage runs on older systems too)
    runs-on: ${{ matrix.os }}
    environment: ${{ (matrix.name == 'windows' && startsWith(github.ref, 'refs/tags/')) && 'release-signing' || '' }}
    permissions:
      contents: write        # add the files to the release
      id-token: write        # sign the build provenance, and sign in to Azure to sign the programs
      attestations: write   # store the provenance with the repository
    env:
      TAG: ${{ github.ref_name }}
      RELEASE: ${{ startsWith(github.ref, 'refs/tags/') }}
      SIGN: ${{ matrix.name == 'windows' && startsWith(github.ref, 'refs/tags/') && vars.AZURE_SIGNING_ACCOUNT != '' }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: What Tauri and Nuitka need on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Install the locked dependencies and Nuitka (every file hash-checked)
        run: python -m pip install --disable-pip-version-check --require-hashes -r requirements.txt -r requirements-nuitka.txt

      - name: Compile Hoard's server with Nuitka
        run: python scripts/build_nuitka.py

      - name: Check the server has everything it needs
        run: build/nuitka/server/hoard-server self-test

      - name: Sign in to Azure, to sign the programs
        if: env.SIGN == 'true'
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign hoard-server.exe
        if: env.SIGN == 'true'
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_SIGNING_PROFILE }}
          files: ${{ github.workspace }}\build\nuitka\server\hoard-server.exe
          description: Hoard
          description-url: https://github.com/${{ github.repository }}
          exclude-environment-credential: true
          exclude-workload-identity-credential: true
          exclude-managed-identity-credential: true
          exclude-shared-token-cache-credential: true
          exclude-visual-studio-credential: true
          exclude-visual-studio-code-credential: true
          exclude-azure-cli-credential: false        # the sign-in above
          exclude-azure-powershell-credential: true
          exclude-azure-developer-cli-credential: true
          exclude-interactive-browser-credential: true

      - name: The Tauri CLI (its lockfile's, every file hash-checked)
        working-directory: shell
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Build the window (Hoard, with the server in its resources)
        working-directory: shell
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          numbers=$(python -c "import re; v=open('../hoard/__init__.py').read(); print('.'.join(re.findall(r'\d+', re.search(r'__version__ = \"([^\"]+)\"', v).group(1))[:3]))")
          echo "NUMBERS=$numbers" >> "$GITHUB_ENV"
          npx tauri build --no-bundle --config "{\"version\": \"$numbers\"}"

      - name: Sign Hoard.exe
        if: env.SIGN == 'true'
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_SIGNING_PROFILE }}
          files: ${{ github.workspace }}\shell\target\release\Hoard.exe
          description: Hoard
          description-url: https://github.com/${{ github.repository }}
          exclude-environment-credential: true
          exclude-workload-identity-credential: true
          exclude-managed-identity-credential: true
          exclude-shared-token-cache-credential: true
          exclude-visual-studio-credential: true
          exclude-visual-studio-code-credential: true
          exclude-azure-cli-credential: false
          exclude-azure-powershell-credential: true
          exclude-azure-developer-cli-credential: true
          exclude-interactive-browser-credential: true

      - name: Make the installer
        working-directory: shell
        env:   # (Linux: linuxdeploy's strip can't read newer libraries, and its tools run unpacked, without FUSE)
          NO_STRIP: "true"
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          npx tauri bundle --verbose --bundles ${{ matrix.bundles }} --config "{\"version\": \"$NUMBERS\"}"

      - name: Name the files, and list their checksums
        run: |
          version=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' hoard/__init__.py)
          mkdir -p dist
          b=shell/target/release/bundle
          case "${{ matrix.name }}" in
            windows) cp $b/nsis/*-setup.exe "dist/Hoard-Tauri-Setup-$version.exe" ;;
            macos-*) cp $b/dmg/*.dmg "dist/Hoard-Tauri-$version-${{ matrix.name }}.dmg" ;;
            linux)   cp $b/appimage/*.AppImage "dist/Hoard-Tauri-$version-linux-x86_64.AppImage"
                     cp $b/deb/*.deb "dist/Hoard-Tauri-$version-linux-amd64.deb" ;;
          esac
          cd dist
          python -c "import hashlib, pathlib; print(''.join(f'{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.name}\n' for p in sorted(pathlib.Path('.').iterdir()) if p.is_file()), end='')" > "SHA256SUMS-tauri-${{ matrix.name }}.txt"
          cat "SHA256SUMS-tauri-${{ matrix.name }}.txt"
          ls -la

      - name: Sign the installer
        if: env.SIGN == 'true'
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}\dist
          files-folder-filter: exe
          description: Hoard setup
          description-url: https://github.com/${{ github.repository }}
          exclude-environment-credential: true
          exclude-workload-identity-credential: true
          exclude-managed-identity-credential: true
          exclude-shared-token-cache-credential: true
          exclude-visual-studio-credential: true
          exclude-visual-studio-code-credential: true
          exclude-azure-cli-credential: false
          exclude-azure-powershell-credential: true
          exclude-azure-developer-cli-credential: true
          exclude-interactive-browser-credential: true

      - name: Check every signature, as Windows sees it, and the setup's checksum after signing
        if: env.SIGN == 'true'
        shell: pwsh
        run: |
          $files = @(Get-Item build\nuitka\server\hoard-server.exe, shell\target\release\Hoard.exe) + @(Get-ChildItem dist\*.exe)
          foreach ($f in $files) {
            $sig = Get-AuthenticodeSignature $f.FullName
            "{0}: {1}, {2}" -f $f.Name, $sig.Status, $sig.SignerCertificate.Subject
            if ($sig.Status -ne "Valid") { Write-Output "::error::$($f.Name) isn't validly signed ($($sig.Status))"; exit 1 }
          }
          Get-ChildItem dist\*.exe | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash $_ -Algorithm SHA256).Hash.ToLower(), $_.Name } | Set-Content dist\SHA256SUMS-tauri-windows.txt

      - name: Sign build provenance
        if: env.RELEASE == 'true' && !github.event.repository.private
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/Hoard-Tauri-*

      - name: Add them to the release
        if: env.RELEASE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber

      - name: Keep them with this run (a push to the branch)
        if: env.RELEASE != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hoard-tauri-${{ matrix.name }}
          path: dist/
          retention-days: 14
          if-no-files-found: error

  # As release.yml: every file is checked by VirusTotal before the release is published, and the results go in its
  # notes. A file an engine flags fails this, and the release stays a draft for a person to look at.
  virustotal:
    needs: [release, build]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write        # read the draft's files, and add the results to its notes
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Get the draft's files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir dist --clobber

      - name: Scan them with VirusTotal
        env:
          VT_API_KEY: ${{ secrets.VT_API_KEY }}   # only this step sees the key
        run: python3 scripts/scan_release_virustotal.py

      - name: Keep any flagged files, for a false-positive report
        if: ${{ always() && hashFiles('dist/VT_FLAGGED.txt') != '' }}
        working-directory: dist
        run: |
          mapfile -t flagged < VT_FLAGGED.txt
          zip -j -P infected "../flagged-$TAG.zip" "${flagged[@]}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ always() && hashFiles('dist/VT_FLAGGED.txt') != '' }}
        with:
          name: virustotal-flagged-files (zip password infected)
          path: flagged-${{ env.TAG }}.zip
          retention-days: 30
          if-no-files-found: error

      - name: Add the results to the release notes
        if: ${{ always() && hashFiles('dist/VT_REPORT.md') != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body > dist/NOTES.md
          python3 scripts/scan_release_virustotal.py --notes dist/NOTES.md dist/VT_REPORT.md
          gh release edit "$TAG" --notes-file dist/NOTES.md --repo "$GITHUB_REPOSITORY"

  # Last: publishing makes the release immutable. A pre-release, never Latest.
  publish:
    needs: [release, build, virustotal]
    if: startsWith(github.ref, 'refs/tags/') && !failure() && !cancelled()
    runs-on: ubuntu-latest
    permissions:
      contents: write        # publish the draft
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$TAG" --draft=false --prerelease --latest=false --repo "$GITHUB_REPOSITORY"
