name: Check

# On every push and pull request, on Linux and on Windows: install the locked dependencies (checking every
# hash), run shuffled tests twice in balanced shards (Windows exercises its own file-safety paths), and build the zip; and build
# Hoard for Windows, macOS and Linux as a release would (release.yml's build: Tauri's window, Nuitka's server, their
# installers and the Flatpak), unsigned. Actions (and the Flatpak build's container) are pinned to exact commits; the
# version is in the comment.

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        shard: [1, 2, 3, 4, 5, 6]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: npm
      - name: Install JavaScript validation tools
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check the compiled Look inside trial
        run: node scripts/build_ui.mjs --check
      - name: Install the locked dependencies
        run: |
          python -m pip install --disable-pip-version-check --require-hashes -r requirements.txt
      - name: C# for the Unity package's tests
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq mono-mcs mono-runtime
      - name: A browser for the store-reader tests
        run: python -m playwright install ${{ matrix.os == 'ubuntu-latest' && '--with-deps' || '' }} chromium
      - name: Tests
        run: python scripts/test_suite.py --shard ${{ matrix.shard }}/6 --seed ${{ github.run_number }} --repeat 2 --summary test-results/${{ matrix.os }}-${{ matrix.shard }}.json
      - name: Keep test results and timings
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tests-${{ matrix.os }}-${{ matrix.shard }}
          path: test-results/*.json
      - name: Build the zips
        if: matrix.shard == 1
        run: python scripts/build_release.py
      - name: Build the Unity package (fails if a file has no .meta)
        if: matrix.shard == 1
        run: python scripts/build_vpm.py

  test-summary:
    if: always()
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: tests-*
          path: test-results
          merge-multiple: true
      - name: Summarize every shard
        env:
          SHARDS_RESULT: ${{ needs.check.result }}
        run: python scripts/test_summary.py test-results --expected 12

  # Hoard for each system, built as release.yml builds it (without signing anything): the server compiled by Nuitka and
  # checked with its self-test, the window built by Tauri with the server in its resources, and its installer.
  app:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, name: windows-x86_64, bundles: nsis }
          - { os: macos-15, name: macos-apple-silicon, bundles: "app,dmg" }
          - { os: macos-15-intel, name: macos-intel, bundles: "app,dmg" }
          - { os: ubuntu-22.04, name: linux-x86_64, bundles: "appimage,deb" }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: What Tauri and Nuitka need on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Install the locked dependencies and Nuitka (every file hash-checked)
        run: python -m pip install --disable-pip-version-check --require-hashes -r requirements.txt -r requirements-nuitka.txt
      - name: Compile Hoard's server with Nuitka
        run: python scripts/build_nuitka.py
      - name: Check the server has everything it needs
        run: build/nuitka/server/hoard-server self-test
      - name: The Tauri CLI (its lockfile's, every file hash-checked)
        working-directory: shell
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build the window (Hoard, with the server in its resources)
        working-directory: shell
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          numbers=$(python -c "import re; v=open('../hoard/__init__.py').read(); print('.'.join(re.findall(r'\d+', re.search(r'__version__ = \"([^\"]+)\"', v).group(1))[:3]))")
          echo "NUMBERS=$numbers" >> "$GITHUB_ENV"
          npx tauri build --no-bundle --config "{\"version\": \"$numbers\"}"
      - name: Make the installer
        working-directory: shell
        env:   # (Linux: linuxdeploy's strip can't read newer libraries, and its tools run unpacked, without FUSE)
          NO_STRIP: "true"
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          npx tauri bundle --verbose --bundles ${{ matrix.bundles }} --config "{\"version\": \"$NUMBERS\"}"
      - name: Keep the .deb, for the Flatpak
        if: matrix.name == 'linux-x86_64'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hoard-deb
          path: shell/target/release/bundle/deb/*.deb
          retention-days: 1
          if-no-files-found: error

  # The Linux Flatpak (shell/flatpak), built from that .deb as a release builds it. Its build checks every library the
  # window needs is in the runtime, and runs the server's self-test inside the sandbox.
  flatpak:
    needs: app
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51@sha256:78d969b18225ae107ca29497bf09c4a3f791e5f1838a9a912a529d0024fb6210
      options: --privileged
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: hoard-deb
          path: deb
      - name: The .deb, where the manifest takes it from
        run: mv deb/*.deb shell/flatpak/hoard.deb && rm -r deb
      - uses: flatpak/flatpak-github-actions/flatpak-builder@79327416609af08178ad73b352877e51450790b3 # v6.8
        with:
          manifest-path: shell/flatpak/io.github.soloflighter1010.Hoard.yml
          bundle: Hoard.flatpak
          upload-artifact: false
          cache: false
