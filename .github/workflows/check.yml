name: Check

# On every push and pull request, on Linux and on Windows: install the locked dependencies (checking every
# hash), run the tests (Windows runs its own file-safety code paths), and build the zip. Actions are pinned
# to exact commits; the version is in the comment.

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"
      - name: Install the locked dependencies
        run: |
          python -m pip install --disable-pip-version-check --require-hashes -r requirements.txt
      - name: C# for the Unity package's tests
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq mono-mcs mono-runtime
      - name: A browser for the store-reader tests
        run: python -m playwright install ${{ matrix.os == 'ubuntu-latest' && '--with-deps' || '' }} chromium
      - name: Tests
        run: python -m unittest discover -s tests -v
      - name: Build the zips
        run: python scripts/build_release.py
      - name: Build the Unity package (fails if a file has no .meta)
        run: python3 scripts/build_vpm.py
