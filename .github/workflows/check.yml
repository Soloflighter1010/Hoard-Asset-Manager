name: Check

# On every push and pull request, on Linux and on Windows: install the locked dependencies (checking every
# hash), run the tests (Windows runs its own file-safety code paths), and build the zip; and build the Windows
# app, the Mac app and the Linux Flatpak as a release would. Actions (and the Flatpak build's container) are pinned
# to exact commits; the version is in the comment.

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"
      - name: Install the locked dependencies
        run: |
          python -m pip install --disable-pip-version-check --require-hashes -r requirements.txt
      - name: C# for the Unity package's tests
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq mono-mcs mono-runtime
      - name: A browser for the store-reader tests
        run: python -m playwright install ${{ matrix.os == 'ubuntu-latest' && '--with-deps' || '' }} chromium
      - name: Tests
        run: python -m unittest discover -s tests -v
      - name: Build the zips
        run: python scripts/build_release.py
      - name: Build the Unity package (fails if a file has no .meta)
        run: python scripts/build_vpm.py

  # The Windows app, built as a release would build it, and checked with its self-test (no installer).
  app-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install the locked dependencies (every file hash-checked)
        run: python -m pip install --disable-pip-version-check --require-hashes -r requirements-app.txt
      - name: Build Hoard.exe and hoard-cli.exe
        run: |
          python packaging/version_info.py
          python -m PyInstaller --noconfirm --clean --distpath dist --workpath build/pyinstaller packaging/hoard.spec
      - name: Check the build has everything it needs
        run: dist\Hoard\hoard-cli.exe self-test

  # The Mac app (Apple Silicon), built and packaged as a release would build it, and checked with its self-test.
  app-macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install the locked dependencies (every file hash-checked)
        run: python -m pip install --disable-pip-version-check --require-hashes -r requirements-mac.txt
      - name: Build Hoard.app
        run: python -m PyInstaller --noconfirm --clean --distpath dist --workpath build/pyinstaller packaging/hoard.spec
      - name: Check the build has everything it needs
        run: dist/Hoard.app/Contents/MacOS/hoard-cli self-test
      - name: Build the installer package
        run: scripts/build_macos_pkg.sh

  # The Linux Flatpak, built as a release would build it. Its build checks Hoard's window support and runs its
  # self-test inside the sandbox.
  flatpak:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51@sha256:78d969b18225ae107ca29497bf09c4a3f791e5f1838a9a912a529d0024fb6210
      options: --privileged
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: flatpak/flatpak-github-actions/flatpak-builder@79327416609af08178ad73b352877e51450790b3 # v6.8
        with:
          manifest-path: packaging/flatpak/io.github.soloflighter1010.Hoard.yml
          bundle: Hoard.flatpak
          upload-artifact: false
          cache-key: flatpak-builder-${{ hashFiles('packaging/flatpak/**', 'requirements-flatpak.txt') }}
