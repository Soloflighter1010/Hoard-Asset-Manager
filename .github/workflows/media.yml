name: Media

# Makes Hoard's videos and their music (promo/: issues #273, #274, #291) and puts them on the "media" release, where
# their addresses stay the same, so the wiki can link them:
# https://github.com/Soloflighter1010/Hoard-Asset-Manager/releases/download/media/<file>
# Run it by hand (Actions > Media > Run workflow) after promo/ changes. It films every video frame by frame, so it
# takes an hour or two.
#
# Everything is made in code: Hoard's own screens, photographed from a made-up data folder (scripts/screenshots.py)
# with the products in promo/products (nothing is made up or drawn for them), shapes and words, and music synthesised
# note by note (promo/music/loop.py). No diffusion. The release is never marked Latest: that stays on the newest
# release of the app.

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: media

jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      contents: write        # put the files on the media release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install the locked dependencies (every file hash-checked), ffmpeg, and fonts for Japanese and Korean
        run: |
          python -m pip install --disable-pip-version-check --require-hashes -r requirements.txt -r promo/requirements.txt
          sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg fonts-noto-cjk
          python -m playwright install --with-deps chromium
      - name: Photograph Hoard's screens, in English, Japanese and Korean
        run: |
          if [ ! -f promo/products/products.json ]; then
            echo "::error::promo/products isn't there: the videos show only the products given (promo/README.md)"; exit 1
          fi
          for lang in en ja ko; do
            python scripts/screenshots.py promo/products build/shots --themes=dark,light --lang=$lang --regions=promo/regions.json
          done
      - name: Make the music and the videos
        run: |
          python promo/music/loop.py
          python promo/build.py $(cd promo/films && ls *.json | sed 's/\.json$//') --lang=en,ja,ko --shape=landscape,portrait --workers=3
      - name: Put them on the media release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/promo/music/hoard-loop.wav build/promo/out/
          files=(build/promo/out/*.mp4 build/promo/out/hoard-loop.wav)
          (cd build/promo/out && sha256sum *.mp4 hoard-loop.wav) > build/promo/out/SHA256SUMS.txt
          notes="Hoard's videos and their music, made in code from Hoard's own screens (promo/ in the repository). No diffusion: Hoard's screens, shapes, words and music synthesised note by note. Made from ${GITHUB_SHA::12}."
          if gh release view media --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload media "${files[@]}" build/promo/out/SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit media --notes "$notes" --latest=false --repo "$GITHUB_REPOSITORY"
          else
            gh release create media "${files[@]}" build/promo/out/SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" \
              --title "Hoard's videos and music" --notes "$notes" --latest=false --target "$GITHUB_SHA"
          fi
