name: Release

# Builds the release zip and publishes it as a GitHub release.
# Runs by itself when a version tag (v1.2.0, ...) is pushed. To build the release for a tag that
# already exists (say an earlier build failed), or to release the branch you pick without making the tag
# yourself, open Actions > Release > Run workflow and enter the tag with its "v" (v1.2.0, not 1.2.0). A tag
# that doesn't exist yet is made on that branch's latest commit; the build refuses it unless it matches
# the version in hoard/__init__.py.
#
# Releases here are immutable: once published, nothing can be added to them. So the release is made as a
# draft, every job attaches its files to the draft, VirusTotal scans them, and the last job publishes it. A
# failed build, or a file VirusTotal flags, leaves only a draft, which a re-run (or Run workflow) fills in and
# publishes.
#
# Every action is pinned to an exact commit (the version tag is in the comment), so a changed or
# compromised tag upstream can't alter what runs here. Update them deliberately.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag to build a release for, for example v1.2.0"
        required: true
      allow_detections:
        description: "Publish even if VirusTotal flags a file (only after checking its report: a false positive)"
        type: boolean
        default: false

permissions: {}

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # the tag (Run workflow), the release and its zips
      id-token: write        # sign the build provenance
      attestations: write   # store the provenance with the repository
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Make the tag, if Run workflow was given a new one
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$TAG" in v[0-9]*) ;; *) echo "::error::Enter the tag with its v, for example v1.2.0 (got $TAG)."; exit 1 ;; esac
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" > /dev/null 2>&1; then
            echo "$TAG already exists; building it."
          else
            version=$(gh api "repos/$GITHUB_REPOSITORY/contents/hoard/__init__.py?ref=$GITHUB_SHA" --jq .content \
              | base64 -d | sed -n 's/^__version__ = "\(.*\)"/\1/p')
            if [ "v$version" != "$TAG" ]; then
              echo "::error::$GITHUB_REF_NAME is version $version, so it can't be released as $TAG."; exit 1
            fi
            gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$TAG" -f sha="$GITHUB_SHA" > /dev/null
            echo "Made $TAG on $GITHUB_REF_NAME ($GITHUB_SHA)."
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false

      # v3.1.0 is a release, and Latest; v3.1.0-beta.1 a beta: a pre-release, never Latest (scripts/release_info.py)
      - name: What this release is
        run: python3 scripts/release_info.py --github-env "$TAG" >> "$GITHUB_ENV"

      - name: Build the zips
        run: python3 scripts/build_release.py --tag "$TAG"

      # A signed record that these exact zips were built here, from this repository and tag.
      # Anyone can check a download with:  gh attestation verify <zip> -R <owner>/<repo>
      # (GitHub only offers this for public repositories on free plans.)
      - name: Sign build provenance
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.zip

      - name: Make the release (a draft until every file is attached)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/*.zip dist/SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$TAG" --title "$TITLE" --prerelease="$PRERELEASE" --notes-file dist/RELEASE_NOTES.md \
              --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" dist/*.zip dist/SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" \
              --title "$TITLE" --prerelease="$PRERELEASE" --notes-file dist/RELEASE_NOTES.md --verify-tag --draft
          fi

  # The Windows app: Hoard.exe (its own window, no console) and hoard-cli.exe, as an installer and a portable zip,
  # added to the same release. Built from requirements-app.txt (every file hash-checked).
  # Code signing (Windows): Hoard.exe, hoard-cli.exe and the setup are signed with Azure Artifact Signing (Trusted
  # Signing) when the repository has it set up (the AZURE_SIGNING_* variables and the AZURE_* secrets of the
  # release-signing environment; see the wiki's Releasing page). Elsewhere, such as a fork, the build is unsigned,
  # as before. Azure is signed in to with GitHub's OIDC token, so no password or key is stored here, and only this
  # job, in the release-signing environment, can ask Azure to sign.
  windows:
    needs: release
    runs-on: windows-latest
    environment: release-signing
    permissions:
      contents: write        # add the installer and zip to the release
      id-token: write        # sign the build provenance, and sign in to Azure to sign the programs
      attestations: write   # store the provenance with the repository
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install the locked dependencies (every file hash-checked)
        run: python -m pip install --disable-pip-version-check --require-hashes -r requirements-app.txt

      - name: Build Hoard.exe and hoard-cli.exe
        run: |
          python packaging/version_info.py
          python -m PyInstaller --noconfirm --clean --distpath dist --workpath build/pyinstaller packaging/hoard.spec

      - name: Check the build has everything it needs
        run: dist\Hoard\hoard-cli.exe self-test

      - name: Sign in to Azure, to sign the programs
        if: ${{ vars.AZURE_SIGNING_ACCOUNT != '' }}
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign Hoard.exe and hoard-cli.exe
        if: ${{ vars.AZURE_SIGNING_ACCOUNT != '' }}
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_SIGNING_PROFILE }}
          files: |
            ${{ github.workspace }}\dist\Hoard\Hoard.exe
            ${{ github.workspace }}\dist\Hoard\hoard-cli.exe
          description: Hoard
          description-url: https://github.com/${{ github.repository }}
          exclude-environment-credential: true
          exclude-workload-identity-credential: true
          exclude-managed-identity-credential: true
          exclude-shared-token-cache-credential: true
          exclude-visual-studio-credential: true
          exclude-visual-studio-code-credential: true
          exclude-azure-cli-credential: false        # the sign-in above
          exclude-azure-powershell-credential: true
          exclude-azure-developer-cli-credential: true
          exclude-interactive-browser-credential: true

      - name: Check the signed build still runs
        if: ${{ vars.AZURE_SIGNING_ACCOUNT != '' }}
        run: dist\Hoard\hoard-cli.exe self-test

      - name: Build the installer (Inno Setup, pinned version)
        shell: pwsh
        run: |
          $version = python -c "import hoard; print(hoard.__version__)"
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --version 6.4.3 -y --no-progress }
          $numbers = python -c "import re, hoard; print('.'.join(re.findall(r'\d+', hoard.__version__)[:3]))"
          & $iscc "/DAppVersion=$version" "/DFileVersion=$numbers" packaging\hoard.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Sign the installer
        if: ${{ vars.AZURE_SIGNING_ACCOUNT != '' }}
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}\dist
          files-folder-filter: exe                     # dist\Hoard-Setup-<version>.exe (not the folders inside)
          description: Hoard setup
          description-url: https://github.com/${{ github.repository }}
          exclude-environment-credential: true
          exclude-workload-identity-credential: true
          exclude-managed-identity-credential: true
          exclude-shared-token-cache-credential: true
          exclude-visual-studio-credential: true
          exclude-visual-studio-code-credential: true
          exclude-azure-cli-credential: false
          exclude-azure-powershell-credential: true
          exclude-azure-developer-cli-credential: true
          exclude-interactive-browser-credential: true

      - name: Check every signature, as Windows sees it
        if: ${{ vars.AZURE_SIGNING_ACCOUNT != '' }}
        shell: pwsh
        run: |
          $files = @(Get-Item dist\Hoard\Hoard.exe, dist\Hoard\hoard-cli.exe) + @(Get-ChildItem dist\Hoard-Setup-*.exe)
          foreach ($f in $files) {
            $sig = Get-AuthenticodeSignature $f.FullName
            "{0}: {1}, {2}" -f $f.Name, $sig.Status, $sig.SignerCertificate.Subject
            if ($sig.Status -ne "Valid") { Write-Output "::error::$($f.Name) isn't validly signed ($($sig.Status))"; exit 1 }
          }

      - name: Zip the app, and list the files' checksums
        shell: pwsh
        run: |
          $version = python -c "import hoard; print(hoard.__version__)"
          Compress-Archive -Path dist\Hoard -DestinationPath "dist\Hoard-$version-windows.zip"
          Get-ChildItem dist\Hoard-Setup-*.exe, dist\Hoard-*-windows.zip | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash $_ -Algorithm SHA256).Hash.ToLower(), $_.Name } | Set-Content dist\SHA256SUMS-windows.txt

      - name: Sign build provenance
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/Hoard-Setup-*.exe
            dist/Hoard-*-windows.zip

      - name: Add them to the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = @(Get-ChildItem dist\Hoard-Setup-*.exe, dist\Hoard-*-windows.zip, dist\SHA256SUMS-windows.txt | ForEach-Object FullName)
          gh release upload $env:TAG @files --repo $env:GITHUB_REPOSITORY --clobber

  # The Mac app, as an installer package for each kind of Mac, built natively on each: Hoard.app, installed in
  # /Applications. Built from requirements-mac.txt (every file hash-checked). Not signed (see the wiki).
  macos:
    needs: release
    strategy:
      matrix:
        runner: [macos-15, macos-15-intel]   # Apple Silicon, Intel
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write        # add the package to the release
      id-token: write        # sign the build provenance
      attestations: write   # store the provenance with the repository
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install the locked dependencies (every file hash-checked)
        run: python -m pip install --disable-pip-version-check --require-hashes -r requirements-mac.txt
      - name: Build Hoard.app
        run: python -m PyInstaller --noconfirm --clean --distpath dist --workpath build/pyinstaller packaging/hoard.spec
      - name: Check the build has everything it needs
        run: dist/Hoard.app/Contents/MacOS/hoard-cli self-test
      - name: Build the installer package
        run: scripts/build_macos_pkg.sh
      - name: Sign build provenance
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/Hoard-*-macos-*.pkg
      - name: Add it to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/Hoard-*-macos-*.pkg dist/SHA256SUMS-macos-*.txt --repo "$GITHUB_REPOSITORY" --clobber

  # The Linux Flatpak (packaging/flatpak), as a bundle: flatpak install Hoard-<version>-linux-x86_64.flatpak.
  # Its build checks Hoard's window support and runs its self-test inside the sandbox.
  flatpak:
    needs: release
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51@sha256:78d969b18225ae107ca29497bf09c4a3f791e5f1838a9a912a529d0024fb6210
      options: --privileged
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
      - uses: flatpak/flatpak-github-actions/flatpak-builder@79327416609af08178ad73b352877e51450790b3 # v6.8
        with:
          manifest-path: packaging/flatpak/io.github.soloflighter1010.Hoard.yml
          bundle: Hoard.flatpak
          artifact-name: flatpak
          cache: false

  # The build's container has no gh, so the bundle is added to the release from here.
  flatpak-release:
    needs: flatpak
    runs-on: ubuntu-latest
    permissions:
      contents: write        # add the bundle to the release
      id-token: write        # sign the build provenance
      attestations: write   # store the provenance with the repository
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: flatpak
          path: dist
      - name: Name it by its version, and checksum it
        run: |
          cd dist
          for f in *.flatpak; do [ "$f" = "Hoard-${TAG#v}-linux-x86_64.flatpak" ] || mv "$f" "Hoard-${TAG#v}-linux-x86_64.flatpak"; done
          sha256sum Hoard-*-linux-x86_64.flatpak > SHA256SUMS-linux.txt
      - name: Sign build provenance
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/Hoard-*-linux-x86_64.flatpak
      - name: Add it to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/Hoard-*-linux-x86_64.flatpak dist/SHA256SUMS-linux.txt --repo "$GITHUB_REPOSITORY" --clobber

  # Every file people download is checked by VirusTotal (scripts/scan_release_virustotal.py) once all are
  # attached, and the results are added to the release notes. If any engine flags one, this fails and the release
  # stays a draft; Run workflow with "Publish even if VirusTotal flags a file" publishes it after a person has
  # checked the report. Needs the VT_API_KEY repository secret (a free VirusTotal account's API key).
  virustotal:
    needs: [release, windows, macos, flatpak-release]
    runs-on: ubuntu-latest
    timeout-minutes: 60      # the scans are waited for up to 40 minutes (VT_WAIT_MINUTES); never GitHub's 6 hours
    permissions:
      contents: write        # read the draft's files, and add the results to its notes
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      # The scanner from this workflow's own commit, not the tag's: it's release tooling, not part of the release,
      # so a re-run for an earlier tag still gets its fixes. (What it scans is the draft's files, downloaded below.)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Get the draft's files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir dist --clobber

      - name: Scan them with VirusTotal
        env:
          VT_API_KEY: ${{ secrets.VT_API_KEY }}   # only this step sees the key
          VT_ALLOW_DETECTIONS: ${{ inputs.allow_detections && 'true' || 'false' }}
        run: python3 scripts/scan_release_virustotal.py

      # A file an engine flags can't be downloaded from the release on Windows (Defender stops the browser), so it
      # couldn't be sent to Microsoft or the engine's maker as a false positive. This keeps the flagged files in a zip
      # encrypted with the password "infected", the form antivirus makers ask samples to be sent in, which Defender
      # doesn't open: download it from this run's Artifacts and upload it to their false-positive form as it is.
      - name: Keep any flagged files, for a false-positive report
        if: ${{ always() && hashFiles('dist/VT_FLAGGED.txt') != '' }}
        working-directory: dist
        run: |
          mapfile -t flagged < VT_FLAGGED.txt
          zip -j -P infected "../flagged-$TAG.zip" "${flagged[@]}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ always() && hashFiles('dist/VT_FLAGGED.txt') != '' }}
        with:
          name: virustotal-flagged-files (zip password infected)
          path: flagged-${{ env.TAG }}.zip
          retention-days: 30
          if-no-files-found: error

      - name: Add the results to the release notes
        if: ${{ always() && hashFiles('dist/VT_REPORT.md') != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body > dist/NOTES.md
          python3 scripts/scan_release_virustotal.py --notes dist/NOTES.md dist/VT_REPORT.md   # a re-run's results replace the last
          gh release edit "$TAG" --notes-file dist/NOTES.md --repo "$GITHUB_REPOSITORY"

  # Last: publishing makes the release immutable, so it waits until every file is attached and scanned.
  publish:
    needs: [release, windows, macos, flatpak-release, virustotal]
    runs-on: ubuntu-latest
    permissions:
      contents: write        # publish the draft
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      # A release becomes Latest (what the website's download buttons offer); a beta never does.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$TAG" in *-beta.*) latest=false ;; *) latest=true ;; esac
          gh release edit "$TAG" --draft=false --latest="$latest" --repo "$GITHUB_REPOSITORY"
