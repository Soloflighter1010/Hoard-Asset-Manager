name: Release

# Builds the release zip and publishes it as a GitHub release.
# Runs by itself when a version tag (v1.2.0, ...) is pushed. To build the release for a tag that
# already exists (say an earlier build failed), or to release the branch you pick without making the tag
# yourself, open Actions > Release > Run workflow and enter the tag with its "v" (v1.2.0, not 1.2.0). A tag
# that doesn't exist yet is made on that branch's latest commit; the build refuses it unless it matches
# the version in hoard/__init__.py.
#
# Releases here are immutable: once published, nothing can be added to them. So the release is made as a
# draft, every job attaches its files to the draft, and the last job publishes it. A failed build leaves
# only a draft, which a re-run (or Run workflow) fills in and publishes.
#
# Every action is pinned to an exact commit (the version tag is in the comment), so a changed or
# compromised tag upstream can't alter what runs here. Update them deliberately.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag to build a release for, for example v1.2.0"
        required: true

permissions: {}

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # the tag (Run workflow), the release and its zips
      id-token: write        # sign the build provenance
      attestations: write   # store the provenance with the repository
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Make the tag, if Run workflow was given a new one
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$TAG" in v[0-9]*) ;; *) echo "::error::Enter the tag with its v, for example v1.2.0 (got $TAG)."; exit 1 ;; esac
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" > /dev/null 2>&1; then
            echo "$TAG already exists; building it."
          else
            version=$(gh api "repos/$GITHUB_REPOSITORY/contents/hoard/__init__.py?ref=$GITHUB_SHA" --jq .content \
              | base64 -d | sed -n 's/^__version__ = "\(.*\)"/\1/p')
            if [ "v$version" != "$TAG" ]; then
              echo "::error::$GITHUB_REF_NAME is version $version, so it can't be released as $TAG."; exit 1
            fi
            gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$TAG" -f sha="$GITHUB_SHA" > /dev/null
            echo "Made $TAG on $GITHUB_REF_NAME ($GITHUB_SHA)."
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false

      - name: Build the zips
        run: python3 scripts/build_release.py --tag "$TAG"

      # A signed record that these exact zips were built here, from this repository and tag.
      # Anyone can check a download with:  gh attestation verify <zip> -R <owner>/<repo>
      # (GitHub only offers this for public repositories on free plans.)
      - name: Sign build provenance
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.zip

      - name: Make the release (a draft until every file is attached)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/*.zip dist/SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$TAG" --notes-file dist/RELEASE_NOTES.md --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" dist/*.zip dist/SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" \
              --title "Hoard $TAG" --notes-file dist/RELEASE_NOTES.md --verify-tag --draft
          fi

  # The Windows app: Hoard.exe (its own window, no console) and hoard-cli.exe, as an installer and a portable zip,
  # added to the same release. Built from requirements-app.txt (every file hash-checked).
  windows:
    needs: release
    runs-on: windows-latest
    permissions:
      contents: write        # add the installer and zip to the release
      id-token: write        # sign the build provenance
      attestations: write   # store the provenance with the repository
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install the locked dependencies (every file hash-checked)
        run: python -m pip install --disable-pip-version-check --require-hashes -r requirements-app.txt

      - name: Build Hoard.exe and hoard-cli.exe
        run: |
          python packaging/version_info.py
          python -m PyInstaller --noconfirm --clean --distpath dist --workpath build/pyinstaller packaging/hoard.spec

      - name: Check the build has everything it needs
        run: dist\Hoard\hoard-cli.exe self-test

      - name: Build the installer (Inno Setup, pinned version)
        shell: pwsh
        run: |
          $version = python -c "import hoard; print(hoard.__version__)"
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --version 6.4.3 -y --no-progress }
          & $iscc "/DAppVersion=$version" packaging\hoard.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Compress-Archive -Path dist\Hoard -DestinationPath "dist\Hoard-$version-windows.zip"
          Get-ChildItem dist\Hoard-Setup-*.exe, dist\Hoard-*-windows.zip | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash $_ -Algorithm SHA256).Hash.ToLower(), $_.Name } | Set-Content dist\SHA256SUMS-windows.txt

      - name: Sign build provenance
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/Hoard-Setup-*.exe
            dist/Hoard-*-windows.zip

      - name: Add them to the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = @(Get-ChildItem dist\Hoard-Setup-*.exe, dist\Hoard-*-windows.zip, dist\SHA256SUMS-windows.txt | ForEach-Object FullName)
          gh release upload $env:TAG @files --repo $env:GITHUB_REPOSITORY --clobber

  # Last: publishing makes the release immutable, so it waits until every file is attached.
  publish:
    needs: [release, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write        # publish the draft
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$TAG" --draft=false --repo "$GITHUB_REPOSITORY"
