name: Build Release

# Builds and publishes a release of the Unity package (Packages/<PACKAGE_NAME>), as VRChat's template-package
# does: the .zip for VCC, a .unitypackage for projects without VCC, and package.json. When it's done, Build Repo
# Listing updates the VCC listing on GitHub Pages.
#
# Runs by hand from Actions (it tags unity-v<version> from Packages/soloflighter.hoard/package.json itself), or when
# that tag is pushed.
#
# Releases here are immutable once published, so, as with the app (release.yml), the release is made as a draft,
# VirusTotal scans its .zip and .unitypackage, and only then is it published. A file VirusTotal flags leaves the
# draft for a person to check; Run workflow with "Publish even if VirusTotal flags a file" publishes it after that.
# Needs the repository variable PACKAGE_NAME = soloflighter.hoard (Settings > Secrets and variables > Actions >
# Variables).
#
# Unlike the template, every action is pinned to an exact commit (its version in the comment), and the release is
# made with the GitHub CLI and this repository's own tested scripts instead of third-party actions.

on:
  push:
    tags: ["unity-v*"]
  workflow_dispatch:
    inputs:
      allow_detections:
        description: "Publish even if VirusTotal flags a file (only after checking its report: a false positive)"
        type: boolean
        default: false

permissions: {}

concurrency:
  group: unity-release

jobs:
  config:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        env:
          PACKAGE_NAME: ${{ vars.PACKAGE_NAME }}
        run: |
          if [ -n "$PACKAGE_NAME" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Set the repository variable PACKAGE_NAME (soloflighter.hoard) to publish the Unity package."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: config
    if: needs.config.outputs.ready == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write        # the draft release and its files
      id-token: write        # sign the build provenance
      attestations: write   # store the provenance with the repository
    env:
      PACKAGE_NAME: ${{ vars.PACKAGE_NAME }}
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      published: ${{ steps.release.outputs.published }}   # already published: nothing to scan or publish
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: The version, from package.json
        id: version
        run: |
          version=$(jq -r .version "Packages/$PACKAGE_NAME/package.json")
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "TAG=unity-v$version" >> "$GITHUB_ENV"
          echo "tag=unity-v$version" >> "$GITHUB_OUTPUT"   # for the scan and publish jobs
          python3 scripts/release_info.py --github-env "unity-v$version" >> "$GITHUB_ENV"   # its title; a beta or not
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "unity-v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match package.json's version $version."
            exit 1
          fi

      - name: Test the package's core (C#, against Hoard's own sealed files)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mono-mcs mono-runtime
          python3 -m unittest tests.test_unity -v

      # The notes cover every version since the last one released (0.3.1 and 0.4.0 were never released on their own)
      - name: Build the .zip and .unitypackage
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          released=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 200 --exclude-drafts --json tagName \
            --jq '.[].tagName | select(startswith("unity-v")) | ltrimstr("unity-v")' | tr '\n' ' ')
          python3 scripts/build_vpm.py --tag "$TAG" --released "$released"

      - name: Sign build provenance
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/vpm/*.zip
            dist/vpm/*.unitypackage

      - name: Make the release, as a draft
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files="dist/vpm/$PACKAGE_NAME-$VERSION.zip dist/vpm/$PACKAGE_NAME-$VERSION.unitypackage dist/vpm/package.json"
          draft=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null || echo none)
          if [ "$draft" = "false" ]; then
            # Published, so its files can't change (releases here are immutable): only its notes are brought up to date
            # (its VirusTotal results are kept: they're in the notes after the marker this replaces up to)
            gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body > dist/vpm/OLD_NOTES.md
            if grep -q "^## VirusTotal scan results" dist/vpm/OLD_NOTES.md; then
              sed -n '/^## VirusTotal scan results/,$p' dist/vpm/OLD_NOTES.md > dist/vpm/VT_REPORT.md
              python3 scripts/scan_release_virustotal.py --notes dist/vpm/RELEASE_NOTES.md dist/vpm/VT_REPORT.md
            fi
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file dist/vpm/RELEASE_NOTES.md
            echo "::notice::$TAG is already published: its notes were updated; its files stay as they were."
            echo "published=true" >> "$GITHUB_OUTPUT"
          elif [ "$draft" = "true" ]; then
            gh release upload "$TAG" $files --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file dist/vpm/RELEASE_NOTES.md
          else
            # Never Latest: that stays on the app, whose files the website's download buttons offer. A beta
            # (package.json 0.6.0-beta.1) is a pre-release. (scripts/release_info.py)
            gh release create "$TAG" $files --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft \
              --title "$TITLE" --prerelease="$PRERELEASE" --latest=false --notes-file dist/vpm/RELEASE_NOTES.md
          fi

  # Every file people download (the .zip VCC installs and the .unitypackage) is checked by VirusTotal
  # (scripts/scan_release_virustotal.py, as for the app), and the results are added to the release notes. If any
  # engine flags one, this fails and the release stays a draft. Needs the VT_API_KEY repository secret.
  virustotal:
    needs: build
    if: needs.build.outputs.published != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60      # the scans are waited for up to 40 minutes (VT_WAIT_MINUTES); never GitHub's 6 hours
    permissions:
      contents: write        # read the draft's files, and add the results to its notes
    env:
      TAG: ${{ needs.build.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Get the draft's files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir dist --clobber

      - name: Scan them with VirusTotal
        env:
          VT_API_KEY: ${{ secrets.VT_API_KEY }}   # only this step sees the key
          VT_ALLOW_DETECTIONS: ${{ inputs.allow_detections && 'true' || 'false' }}
        run: python3 scripts/scan_release_virustotal.py

      # Defender won't let a browser download a file it flags, so the flagged files are kept in a zip encrypted with
      # the password "infected" (the form antivirus makers ask samples in), for a false-positive report.
      - name: Keep any flagged files, for a false-positive report
        if: ${{ always() && hashFiles('dist/VT_FLAGGED.txt') != '' }}
        working-directory: dist
        run: |
          mapfile -t flagged < VT_FLAGGED.txt
          zip -j -P infected "../flagged-$TAG.zip" "${flagged[@]}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ always() && hashFiles('dist/VT_FLAGGED.txt') != '' }}
        with:
          name: virustotal-flagged-files (zip password infected)
          path: flagged-${{ env.TAG }}.zip
          retention-days: 30
          if-no-files-found: error

      - name: Add the results to the release notes
        if: ${{ always() && hashFiles('dist/VT_REPORT.md') != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body > dist/NOTES.md
          python3 scripts/scan_release_virustotal.py --notes dist/NOTES.md dist/VT_REPORT.md   # a re-run's results replace the last
          gh release edit "$TAG" --notes-file dist/NOTES.md --repo "$GITHUB_REPOSITORY"

  # Last: publishing makes the release immutable (and tags it, for a run started by hand), so it waits for the scan.
  publish:
    needs: [build, virustotal]
    runs-on: ubuntu-latest
    permissions:
      contents: write        # publish the draft
    env:
      TAG: ${{ needs.build.outputs.tag }}
    steps:
      # Never Latest: that stays on the app, whose files the website's download buttons offer
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$TAG" --draft=false --latest=false --repo "$GITHUB_REPOSITORY"
