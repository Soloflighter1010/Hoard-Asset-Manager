name: Build Repo Listing

# Builds the VCC listing (index.json) and its page (Website/) from every release's package .zip with VRChat's
# package-list-action, as the template-package does, and deploys them to GitHub Pages with Hoard's website (site/,
# issue #27) in front: the site at the root, the listing's page at vcc/, and index.json where VCC knows it. Runs
# after Build Release, whenever a release changes, when the site or the listing's files change on main, or by hand.
# Needs Settings > Pages > Source: GitHub Actions.
# The listing's name, id and address are in source.json.
#
# Differences from the template:
# - Every action, and package-list-action itself, is pinned to an exact commit instead of a branch or tag.
# - package-list-action is given a "current listing" address that doesn't exist, so it rebuilds from every
#   release each time. (Its current code skips releases already in the live listing without carrying them over,
#   which would leave only newly released versions in each rebuilt listing.)
# - The listing is also copied to vpm/index.json, the address used before this setup, so it keeps working.
# - Building it is tried again (up to 4 times, 30 seconds apart) in case it ran while a release was being made.
# - A release event runs on the release's tag, which github-pages refuses to deploy from, so for those the
#   build is started again on the default branch instead.

env:
  listPublishDirectory: Website
  pathToCi: ci

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["site/**", "Website/**", "source.json", "CHANGELOG.md", "scripts/build_site_changelog.py",
            ".github/workflows/build-listing.yml"]
  workflow_run:
    workflows: [Build Release]
    types: [completed]
  release:
    types: [published, created, edited, unpublished, deleted, released]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  # A release changed: build the listing from the default branch (see above).
  release-changed:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      actions: write         # start this workflow on the default branch
    steps:
      - name: Build the listing from the default branch
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.event.repository.default_branch }}
        run: gh workflow run build-listing.yml --ref "$BRANCH" --repo "$GITHUB_REPOSITORY"

  build-listing:
    name: build-listing
    if: github.event_name != 'release'
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: VRChat's listing builder, at a pinned commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: vrchat-community/package-list-action
          ref: cb31c3b5d17d1070d7741c61de2ca1b219224039
          path: ${{ env.pathToCi }}
          clean: false
          persist-credentials: false

      # Tried up to 4 times, 30 seconds apart: a run can start while a release is still being made (a push to main
      # during Build Release, or Build Release's own run starting the moment it finishes), when its tag exists but
      # its .zip isn't there to download yet ("Could not find valid zip file"). A failure that lasts is still one.
      - name: Build the listing from every release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGE_NAME: ${{ vars.PACKAGE_NAME }}
        run: |
          for attempt in 1 2 3 4; do
            if ${{ env.pathToCi }}/build.cmd BuildRepoListing --root ${{ env.pathToCi }} \
                --list-publish-directory "$GITHUB_WORKSPACE/${{ env.listPublishDirectory }}" \
                --current-package-name "$PACKAGE_NAME" \
                --current-listing-url "https://${{ github.repository_owner }}.github.io/no-current-listing.json"; then
              exit 0
            fi
            [ "$attempt" = 4 ] && break
            echo "::warning::The listing build failed (attempt $attempt of 4); trying again in 30 seconds, in case a release was still being made."
            sleep 30
          done
          echo "::error::The listing build failed 4 times, 30 seconds apart: see the errors above."
          exit 1

      - name: Keep the earlier listing address (vpm/index.json) working
        run: mkdir -p ${{ env.listPublishDirectory }}/vpm && cp ${{ env.listPublishDirectory }}/index.json ${{ env.listPublishDirectory }}/vpm/index.json

      # The listing's page (rendered above) moves to vcc/ with what it loads; index.json and banner.png stay at the
      # root, where VCC and the listing expect them. Hoard's website takes the root.
      - name: Put Hoard's website in front, and the listing's page at vcc/
        working-directory: ${{ env.listPublishDirectory }}
        run: |
          mkdir vcc
          mv index.html app.js vcc/
          cp -r styles.css vendor favicon.ico banner.png vcc/
          cp -r "$GITHUB_WORKSPACE/site/." .
          test -f index.html && test -f vcc/index.html && test -f index.json && test -f vpm/index.json

      # The website's What's new page, from CHANGELOG.md, with each release's date from GitHub (a release without
      # one, or a failed lookup, is shown without a date).
      - name: Build the What's new page from the changelog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --repo "$GITHUB_REPOSITORY" --limit 300 --json tagName,publishedAt > "$RUNNER_TEMP/dates.json" || echo "[]" > "$RUNNER_TEMP/dates.json"
          python3 scripts/build_site_changelog.py "${{ env.listPublishDirectory }}/changelog.html" --dates "$RUNNER_TEMP/dates.json"
          test -s "${{ env.listPublishDirectory }}/changelog.html"

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: ${{ env.listPublishDirectory }}
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
