<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hoard Downloader</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Cg%20transform%3D%22translate%280%200%29%20scale%281.0%29%22%3E%0A%20%20%3Crect%20x%3D%225%22%20y%3D%2230%22%20width%3D%2227%22%20height%3D%2227%22%20rx%3D%227%22%20fill%3D%22%2356D1DC%22%20stroke%3D%22%23211C18%22%20stroke-width%3D%223%22%20transform%3D%22rotate%28-9%2018.5%2043.5%29%22/%3E%0A%20%20%3Crect%20x%3D%2231%22%20y%3D%2231%22%20width%3D%2227%22%20height%3D%2227%22%20rx%3D%227%22%20fill%3D%22%23FF8AD8%22%20stroke%3D%22%23211C18%22%20stroke-width%3D%223%22%20transform%3D%22rotate%287%2044.5%2044.5%29%22/%3E%0A%20%20%3Crect%20x%3D%2217.5%22%20y%3D%228%22%20width%3D%2228%22%20height%3D%2228%22%20rx%3D%227%22%20fill%3D%22%23F0B429%22%20stroke%3D%22%23211C18%22%20stroke-width%3D%223%22%20transform%3D%22rotate%28-4%2031.5%2022%29%22/%3E%0A%20%20%3Cpath%20d%3D%22M38%2013.5%20l1.6%203.9%203.9%201.6%20-3.9%201.6%20-1.6%203.9%20-1.6%20-3.9%20-3.9%20-1.6%203.9%20-1.6z%22%20fill%3D%22%23FFF8E6%22/%3E%0A%3C/g%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet">
<style>
/* Hoard: warm cave neutrals so the art is the loudest thing on screen; gold means "yours" or "do this". */
:root {
  --cave: #211C18; --ledge: #2B2520; --stone: #372F28; --seam: #4A4037;
  --bone: #F4EDE3; --dust: #B3A695; --gold: #F0B429; --gold-ink: #2A1D00; --warn: #FF9F6B;
  --booth: #FF6259; --gumroad: #FF8AD8; --jinxxy: #56D1DC; --payhip: #95A0FF;
  --ph-l: 30%; --ph-s: 28%;
  --slot-size: 172px; --bar-h: 72px;
  --display: "Dela Gothic One", "Hiragino Sans", "Yu Gothic UI", "Segoe UI Black", system-ui, sans-serif;
  --body: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Yu Gothic UI", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root {
    --cave: #EEECE8; --ledge: #FFFFFF; --stone: #E3DFD8; --seam: #D2CCC3;
    --bone: #211C18; --dust: #6B6157; --gold: #B07A00; --gold-ink: #FFFFFF; --warn: #B4531B;
    --booth: #D8332B; --gumroad: #C8339A; --jinxxy: #07808B; --payhip: #5360D6;
    --ph-l: 82%; --ph-s: 30%;
    color-scheme: light;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { font: 500 15px/1.5 var(--body); background: var(--cave); color: var(--bone); -webkit-font-smoothing: antialiased; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { cursor: default; opacity: .5; }
a { color: var(--gold); text-underline-offset: 3px; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
[hidden] { display: none !important; }
* { scrollbar-width: thin; scrollbar-color: var(--seam) transparent; }

/* top bar */
.bar {
  position: sticky; top: 0; z-index: 10; min-height: var(--bar-h);
  display: flex; align-items: center; gap: 18px; flex-wrap: wrap; padding: 12px 24px; background: var(--cave);
}
.brand { display: flex; align-items: center; color: var(--bone); text-decoration: none; margin-right: 6px; flex: none; }
.brand svg { height: 34px; width: auto; display: block; }
.brand .word { fill: currentColor; }
.search { position: relative; flex: 1 1 280px; max-width: 620px; display: block; }
.search svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; color: var(--dust); pointer-events: none; }
.search input {
  width: 100%; height: 44px; padding: 0 44px; border-radius: 12px; border: 0;
  background: var(--ledge); box-shadow: inset 0 0 0 1px var(--seam);
}
.search input:focus { outline: none; box-shadow: inset 0 0 0 2px var(--gold); }
.search input::placeholder { color: var(--dust); }
.search kbd {
  position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
  font: 700 12px var(--body); color: var(--dust); background: var(--stone); border-radius: 6px; padding: 1px 7px;
}
.tools { display: flex; align-items: center; gap: 10px; margin-left: auto; }
.tools label { display: flex; align-items: center; gap: 8px; color: var(--dust); font-size: 13px; }
.tools select {
  height: 38px; padding: 0 30px 0 12px; border-radius: 10px; border: 0; background: var(--ledge);
  box-shadow: inset 0 0 0 1px var(--seam); appearance: none; -webkit-appearance: none; color: var(--bone);
  background-image: linear-gradient(45deg, transparent 50%, var(--dust) 50%), linear-gradient(135deg, var(--dust) 50%, transparent 50%);
  background-position: calc(100% - 16px) 17px, calc(100% - 11px) 17px; background-size: 5px 5px; background-repeat: no-repeat;
}
.zoom input { width: 96px; accent-color: var(--gold); }
.zoom svg { width: 16px; height: 16px; }
.ghost, .btn {
  height: 38px; padding: 0 14px; border-radius: 10px; border: 0; background: var(--ledge);
  box-shadow: inset 0 0 0 1px var(--seam); display: inline-flex; align-items: center; gap: 8px; text-decoration: none; color: var(--bone);
}
.ghost:hover { background: var(--stone); }
.stores-btn .warn-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--warn); }
.job { flex-basis: 100%; margin: -6px 0 0; font-size: 13px; color: var(--dust); }
.job::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--gold); margin-right: 8px; animation: pulse 1.2s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .25; } }
.only-narrow { display: none; }

/* store shelf: which store you're looking at */
.seg {
  position: sticky; top: var(--bar-h); z-index: 9; display: flex; gap: 4px; padding: 0 24px; overflow-x: auto;
  background: var(--cave); border-bottom: 1px solid var(--seam);
}
.seg button {
  position: relative; height: 44px; padding: 0 12px; border: 0; background: none; color: var(--dust);
  display: flex; align-items: center; gap: 8px; white-space: nowrap; font-weight: 700;
}
.seg button .n { font-weight: 500; font-size: 13px; opacity: .8; font-variant-numeric: tabular-nums; }
.seg button:hover { color: var(--bone); }
.seg button[aria-checked="true"] { color: var(--bone); }
.seg button[aria-checked="true"]::after {
  content: ""; position: absolute; left: 10px; right: 10px; bottom: -1px; height: 3px; border-radius: 3px 3px 0 0; background: var(--c, var(--gold));
}
.dot { width: 9px; height: 9px; border-radius: 3px; display: inline-block; flex: none; background: var(--c); transform: rotate(45deg); }
.booth { --c: var(--booth); } .gumroad { --c: var(--gumroad); } .jinxxy { --c: var(--jinxxy); } .payhip { --c: var(--payhip); }

/* stores panel */
.stores {
  position: fixed; z-index: 25; right: 24px; top: calc(var(--bar-h) + 6px); width: min(470px, calc(100vw - 32px));
  max-height: calc(100vh - var(--bar-h) - 24px); overflow: auto;
  background: var(--ledge); border-radius: 16px; padding: 10px 20px 20px; box-shadow: 0 0 0 1px var(--seam), 0 20px 50px rgb(0 0 0 / .45);
}
.stores h2 { font: 400 20px var(--display); margin: 12px 0 4px; }
.stores > p { margin: 0 0 10px; color: var(--dust); font-size: 14px; }
.store-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; padding: 14px 0; border-top: 1px solid var(--seam); align-items: center; }
.store-row .nm { font-weight: 700; font-size: 16px; display: flex; align-items: center; gap: 9px; }
.store-row .meta { grid-column: 1; font-size: 13px; color: var(--dust); }
.store-row .err { grid-column: 1 / -1; font-size: 13px; color: var(--warn); line-height: 1.45; }
.store-row .btns { grid-row: 1 / span 2; grid-column: 2; display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 6px; max-width: 260px; }
.ghost.sm { height: 32px; padding: 0 11px; font-size: 13px; }
.primary {
  height: 42px; padding: 0 18px; border: 0; border-radius: 10px; background: var(--gold); color: var(--gold-ink);
  font-weight: 700; display: inline-flex; align-items: center; text-decoration: none;
}
.primary:hover { filter: brightness(1.06); }
.stores .primary { width: 100%; justify-content: center; margin-top: 14px; }
.stores .hint { font-size: 13px; color: var(--dust); margin: 14px 0 0; line-height: 1.5; }
.drop { position: fixed; inset: 0; z-index: 40; display: grid; place-items: center; background: rgb(20 16 12 / .7);
  font: 400 26px var(--display); color: #F4EDE3; pointer-events: none; }

/* layout */
.layout { display: grid; grid-template-columns: 250px minmax(0, 1fr); }
.side {
  position: sticky; top: calc(var(--bar-h) + 45px); align-self: start; height: calc(100vh - var(--bar-h) - 45px);
  overflow: auto; padding: 18px 20px 28px 24px;
}
.side h2 { font: 700 13px var(--body); color: var(--dust); margin: 20px 0 10px; }
.side h2:first-child { margin-top: 6px; }
.chips { display: flex; flex-wrap: wrap; gap: 4px 12px; }
.chip { font-weight: 700; font-size: 14px; padding: 2px 0; border: 0; background: none; color: var(--bone); border-radius: 6px; }
.chip[data-tag]::before { content: "#"; color: var(--dust); margin-right: 1px; }
.chip .n { color: var(--dust); margin-left: 4px; font-weight: 500; font-size: 12px; font-variant-numeric: tabular-nums; }
.chip:hover { color: var(--gold); }
.chip[aria-pressed="true"] { background: var(--gold); color: var(--gold-ink); padding: 2px 8px; }
.chip[aria-pressed="true"]::before, .chip[aria-pressed="true"] .n { color: inherit; opacity: .7; }
.linkish { background: none; border: 0; padding: 0; color: var(--gold); text-decoration: underline; text-underline-offset: 3px; font-weight: 700; }
.side .linkish { font-size: 13px; margin-top: 10px; }
.find { width: 100%; height: 36px; padding: 0 12px; border-radius: 10px; border: 0; background: var(--ledge); box-shadow: inset 0 0 0 1px var(--seam); margin-bottom: 6px; }
.find:focus { outline: none; box-shadow: inset 0 0 0 2px var(--gold); }
.creators { list-style: none; margin: 0 -8px; padding: 0; max-height: 380px; overflow: auto; }
.creators button {
  width: 100%; display: flex; justify-content: space-between; gap: 8px; text-align: left;
  padding: 5px 8px; border: 0; border-radius: 8px; background: none; font-size: 14px;
}
.creators button span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.creators button:hover { background: var(--ledge); }
.creators button[aria-pressed="true"] { background: var(--gold); color: var(--gold-ink); font-weight: 700; }
.creators .n { color: var(--dust); font-size: 12px; font-variant-numeric: tabular-nums; }
.creators button[aria-pressed="true"] .n { color: inherit; }
.none { color: var(--dust); font-size: 13px; }
.totals { color: var(--dust); font-size: 13px; margin-top: 24px; line-height: 1.5; }

/* the collection */
main { padding: 22px 24px 64px 8px; min-width: 0; }
.count { font: 400 clamp(22px, 2.4vw, 30px)/1.15 var(--display); margin: 0; letter-spacing: .005em; }
.count .of { color: var(--dust); }
.status { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin: 12px 0 0; font-size: 14px; color: var(--dust); }
.status:empty { display: none; }
.status + .grid, .count + .status:empty + .grid { margin-top: 22px; }
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 700; padding: 3px 5px 3px 11px; border-radius: 8px; background: var(--ledge); box-shadow: inset 0 0 0 1px var(--seam); border: 0; }
.pill b { font-weight: 500; color: var(--dust); }
.pill span[aria-hidden] { width: 18px; height: 18px; display: grid; place-items: center; border-radius: 5px; }
.pill:hover span[aria-hidden] { background: var(--stone); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(var(--slot-size), 1fr)); gap: 22px 16px; }
.slot { display: flex; flex-direction: column; gap: 7px; min-width: 0; padding: 0; border: 0; background: none; text-align: left; }
.slot:focus-visible { outline: none; }
.art { position: relative; aspect-ratio: 1; border-radius: 12px; overflow: hidden; background: var(--ledge); transition: transform .12s ease-out; }
.slot:hover .art { transform: translateY(-3px); }
.slot:focus-visible .art { outline: 3px solid var(--gold); outline-offset: 3px; }
.art img { width: 100%; height: 100%; object-fit: cover; display: block; }
/* store spine along the bottom edge of every tile */
.notch { position: absolute; left: 0; right: 0; bottom: 0; height: 5px; background: var(--c); }
.badge {
  position: absolute; left: 8px; top: 8px; font-size: 11px; font-weight: 700;
  padding: 2px 8px; border-radius: 6px; background: rgb(20 16 12 / .78); color: #F4EDE3;
}
.ph { width: 100%; height: 100%; display: grid; place-content: center; background: hsl(var(--h) var(--ph-s) var(--ph-l)); }
.ph b { font: 400 calc(var(--slot-size) * .26)/1 var(--display); opacity: .85; }
.nm-t, .slot .nm { font-weight: 700; font-size: 14.5px; line-height: 1.3; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.cr { font-size: 13px; color: var(--dust); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: -5px; }
.empty { max-width: 46ch; margin: 56px auto; text-align: center; color: var(--dust); }
.empty svg { width: 96px; height: 96px; margin-bottom: 10px; }
.empty h2 { font: 400 26px/1.2 var(--display); color: var(--bone); margin: 0 0 10px; }
.empty code { background: var(--ledge); padding: 1px 6px; border-radius: 5px; color: var(--bone); }
.empty .primary { margin-top: 6px; }

/* details */
.scrim { position: fixed; inset: 0; background: rgb(20 16 12 / .5); z-index: 19; }
.detail {
  position: fixed; top: 0; right: 0; bottom: 0; z-index: 20; width: min(470px, 100vw);
  overflow: auto; padding: 18px 24px 36px; background: var(--ledge); box-shadow: -1px 0 0 var(--seam);
  transform: translateX(100%); visibility: hidden; transition: transform .2s ease-out, visibility 0s .2s;
}
.detail.open { transform: none; visibility: visible; transition: transform .2s ease-out; }
.x { position: sticky; top: 0; float: right; width: 38px; height: 38px; border-radius: 10px; border: 0; background: var(--stone); font-size: 20px; line-height: 1; z-index: 1; }
.d-art { position: relative; aspect-ratio: 1; border-radius: 14px; overflow: hidden; background: var(--stone); clear: both; margin-top: 10px; }
.d-art img { width: 100%; height: 100%; object-fit: contain; display: block; }
.d-art .ph b { font-size: 96px; }
.d-name { font: 400 26px/1.2 var(--display); margin: 20px 0 6px; overflow-wrap: anywhere; }
.d-by { margin: 0; color: var(--dust); }
.d-store { display: flex; align-items: center; gap: 9px; margin: 10px 0 0; font-weight: 700; }
.note { margin: 14px 0 0; padding: 12px 14px; border-radius: 12px; background: var(--stone); font-size: 14px; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; margin: 20px 0 4px; }
a.ghost { height: 42px; }
.detail h3 { font: 700 13px var(--body); color: var(--dust); margin: 26px 0 10px; }
.detail .chips { gap: 4px 12px; }
.files { list-style: none; margin: 0; padding: 0; }
.files li { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 10px; padding: 8px 0; border-top: 1px solid var(--seam); font-size: 14px; }
.files .fn { overflow-wrap: anywhere; }

.toast {
  position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 8px); z-index: 30;
  background: var(--bone); color: var(--cave); padding: 10px 16px; border-radius: 12px; font-size: 14px; font-weight: 700;
  opacity: 0; pointer-events: none; transition: opacity .15s, transform .15s;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }

@media (min-width: 1100px) {
  .detail { top: calc(var(--bar-h) + 45px); border-top-left-radius: 16px; }
  body.panel-open main { padding-right: 494px; }
}
@media (max-width: 860px) {
  :root { --slot-size: 136px; }
  .bar { padding: 12px 16px; gap: 10px; position: static; }
  .search { order: 5; flex-basis: 100%; max-width: none; }
  .search kbd, .tools .zoom { display: none; }
  .tools { margin-left: 0; flex-wrap: wrap; }
  .seg { position: static; padding: 0 12px; }
  .only-narrow { display: inline-flex; }
  .layout { grid-template-columns: minmax(0, 1fr); }
  .side { display: none; position: static; height: auto; padding: 14px 16px; border-bottom: 1px solid var(--seam); }
  .side.open { display: block; }
  main { padding: 18px 16px 48px; }
  .stores { top: 12px; right: 16px; }
}
@media (prefers-reduced-motion: reduce) {
  .detail, .detail.open, .toast, .art { transition: none; }
  .slot:hover .art { transform: none; }
  .job::before { animation: none; }
}

/* downloader-only pieces */
.brand .sub { font: 700 13px var(--body); color: var(--dust); margin-left: 10px; padding: 3px 9px; border-radius: 7px; background: var(--ledge); box-shadow: inset 0 0 0 1px var(--seam); }
.flag { position: absolute; right: 8px; top: 8px; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 6px; background: var(--warn); color: #2A1400; }
.ph { justify-items: center; gap: 6px; }
.ph small { font-size: 12px; font-weight: 700; opacity: .7; }
.also { margin: 14px 0 0; padding: 12px 14px; border-radius: 12px; background: var(--stone); font-size: 14px; }
.files li { grid-template-columns: minmax(0, 1fr) auto auto; }
.files .fs { color: var(--dust); font-variant-numeric: tabular-nums; white-space: nowrap; font-size: 13px; }
.files .miss .fs { color: var(--warn); }
.detail h3 .muted { font-weight: 500; color: var(--dust); margin-left: 8px; }
.path { font-size: 12.5px; color: var(--dust); overflow-wrap: anywhere; user-select: all; margin-top: 22px; }
.empty ul { text-align: left; padding-left: 20px; }

/* footer */
.foot { margin-top: 64px; padding-top: 20px; border-top: 1px solid var(--seam); display: flex; flex-wrap: wrap;
  align-items: center; gap: 10px 24px; font-size: 13px; color: var(--dust); }
.foot-brand { display: flex; align-items: center; gap: 8px; font-weight: 700; color: var(--bone); }
.foot-brand svg { width: 22px; height: 22px; }
.foot-links { display: flex; flex-wrap: wrap; gap: 6px 16px; }
.foot-links a { color: var(--dust); text-decoration: none; }
.foot-links a:hover { color: var(--gold); text-decoration: underline; }
.foot-note { flex-basis: 100%; margin: 0; }
</style>
</head>
<body>
<header class="bar">
  <a class="brand" href="/"><svg viewBox="0 0 226 64" role="img" aria-label="Hoard"><g transform="translate(0 0) scale(1.0)">
  <rect x="5" y="30" width="27" height="27" rx="7" fill="#56D1DC" style="stroke: var(--cave)" stroke-width="3" transform="rotate(-9 18.5 43.5)"/>
  <rect x="31" y="31" width="27" height="27" rx="7" fill="#FF8AD8" style="stroke: var(--cave)" stroke-width="3" transform="rotate(7 44.5 44.5)"/>
  <rect x="17.5" y="8" width="28" height="28" rx="7" fill="#F0B429" style="stroke: var(--cave)" stroke-width="3" transform="rotate(-4 31.5 22)"/>
  <path d="M38 13.5 l1.6 3.9 3.9 1.6 -3.9 1.6 -1.6 3.9 -1.6 -3.9 -3.9 -1.6 3.9 -1.6z" fill="#FFF8E6"/>

2.0 351.0Q411 376 364 376Q319 376 288.5 347.5Q258 319 258 273Q258 222 286.0 190.0Q314 158 362 158Q411 158 442.0 185.5Q473 213 473 273Z"/></g></svg><span class="sub">Downloads</span></a>

</g></svg><span>Hoard Downloader <span id="version"></span></span></div>

<aside id="detail" class="detail" aria-label="Asset details"></aside>

<script>
"use strict";
const $ = s => document.querySelector(s);
const grid = $("#grid"), detail = $("#detail");
const state = { q: "", store: "", tags: new Set(), types: new Set(), creator: "", sort: "name", allTags: false, creatorFind: "" };
let DATA = { assets: [] }, byId = new Map(), openId = null, lastFocus = null;

// Only plain web addresses become links; anything else from a store page (javascript:, file:, ...) is dropped.
const safeUrl = u => { try { const x = new URL(u); return x.protocol === "https:" || x.protocol === "http:" ? x.href : ""; } catch (e) { return ""; } };
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const norm = s => String(s || "").normalize("NFKC").toLowerCase();
const coll = new Intl.Collator(undefined, { numeric: true, sensitivity: "base" });
const fileUrl = p => "/files/" + p.split("/").map(encodeURIComponent).join("/");
const hue = s => { let h = 7; for (const c of s) h = (h * 31 + c.codePointAt(0)) % 360; return h; };
const initials = s => (s.match(/[\p{L}\p{N}]+/gu) || ["?"]).slice(0, 2).map(w => [...w][0]).join("").toUpperCase();
function fmtSize(n) {
  if (n == null) return "";
  const u = ["B", "KB", "MB", "GB", "TB"]; let i = 0;
  while (n >= 1024 && i < u.length - 1) { n /= 1024; i++; }
  return (i ? n.toFixed(n < 10 ? 1 : 0) : n) + " " + u[i];
}
function placeholder(a) {
  return `<span class="ph" style="--h:${hue(a.creator)}"><b>${esc(initials(a.name))}</b>` +
         `<small>${a.types[0] ? "." + esc(a.types[0]) : ""}</small></span>`;
}
const art = a => a.thumb ? `<img src="${fileUrl(a.thumb)}" alt="" loading="lazy" decoding="async">` : placeholder(a);

let toastTimer;
function toast(msg) {
  const t = $("#toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 2200);
}

/* ---------- data */
async function load(rescan = false) {
  try {
    const r = await fetch("/api/assets" + (rescan ? "?rescan=1" : ""));
    if (!r.ok) throw new Error(r.status === 403
      ? `The library server refused this address. Open http://127.0.0.1:${location.port || 8765}/ on the PC running it, or start it with --host 0.0.0.0.`
      : `The library server answered ${r.status} ${r.statusText}.`);
    DATA = await r.json();
  } catch (e) {
    DATA = { assets: [], error: e instanceof TypeError ? "Hoard Downloader isn't running. Start it again from its menu (Browse your downloads)." : e.message };
  }
  $("#version").textContent = DATA.version || "";
  for (const a of DATA.assets) {
    a.hay = norm([a.name, a.creator, a.store, a.variants, ...a.tags, ...a.files.map(f => f.path)].join(" "));
  }
  byId = new Map(DATA.assets.map(a => [a.id, a]));
  render();
  if (openId != null && byId.has(openId)) showDetail(byId.get(openId), false);
  return DATA.assets.length;
}

/* ---------- filtering */
function matches(a, skip) {
  if (state.store && a.store !== state.store) return false;
  if (skip !== "creator" && state.creator && a.creator !== state.creator) return false;
  for (const t of state.tags) if (!a.tags.includes(t)) return false;
  for (const t of state.types) if (!a.types.includes(t)) return false;
  for (const tok of norm(state.q).split(/\s+/)) if (tok && !a.hay.includes(tok)) return false;
  return true;
}
const SORTS = {
  name: (a, b) => coll.compare(a.name, b.name),
  creator: (a, b) => coll.compare(a.creator, b.creator) || coll.compare(a.name, b.name),
  newest: (a, b) => (b.added || "").localeCompare(a.added || "") || (b.modified || 0) - (a.modified || 0),
  size: (a, b) => b.size - a.size,
};
const countBy = (list, key) => {
  const m = new Map();
  for (const a of list) for (const v of a[key]) m.set(v, (m.get(v) || 0) + 1);
  return m;
};
const filtersActive = () => state.q || state.store || state.creator || state.tags.size || state.types.size;

/* ---------- rendering */
function render() {
  const list = DATA.assets.filter(a => matches(a)).sort(SORTS[state.sort]);
  renderGrid(list); renderFacets(list); renderStatus(list); syncControls(); saveHash();
}

function renderGrid(list) {
  grid.innerHTML = list.map(a =>
    `<button class="slot" data-id="${a.id}" aria-label="${esc(a.name)}, by ${esc(a.creator)}, from ${a.store}">` +
      `<span class="art">${art(a)}<i class="notch ${a.store.toLowerCase()}"></i>` +
        `${a.missing ? '<span class="flag">Missing files</span>' : ""}</span>` +
      `<span class="nm">${esc(a.name)}</span><span class="cr">${esc(a.creator)}</span>` +
    `</button>`).join("");

  const empty = $("#empty");
  if (DATA.error) {
    empty.innerHTML = `<h2>Can't reach your downloads</h2><p>${esc(DATA.error)}</p>`;
  } else if (!DATA.assets.length) {
    const st = DATA.status || { stores: {}, elsewhere: [] };
    const rows = Object.entries(st.stores).map(([s, i]) =>
      `<li>${s}: ${i.found ? `manifest found, ${i.assets} assets with files` : `no <code>${esc(i.manifest)}</code>`}</li>`).join("");
    const other = st.elsewhere.map(p => `<li>Downloads found in <code>${esc(p)}</code>. Set <code>"root"</code> in config.json to this folder and restart.</li>`).join("");
    empty.innerHTML = `<svg viewBox="0 0 64 64" aria-hidden="true"><g transform="translate(0 0) scale(1.0)">
  <rect x="5" y="30" width="27" height="27" rx="7" fill="#56D1DC" style="stroke: var(--cave)" stroke-width="3" transform="rotate(-9 18.5 43.5)"/>
  <rect x="31" y="31" width="27" height="27" rx="7" fill="#FF8AD8" style="stroke: var(--cave)" stroke-width="3" transform="rotate(7 44.5 44.5)"/>
  <rect x="17.5" y="8" width="28" height="28" rx="7" fill="#F0B429" style="stroke: var(--cave)" stroke-width="3" transform="rotate(-4 31.5 22)"/>
  <path d="M38 13.5 l1.6 3.9 3.9 1.6 -3.9 1.6 -1.6 3.9 -1.6 -3.9 -3.9 -1.6 3.9 -1.6z" fill="#FFF8E6"/>
</g></svg><h2>Nothing downloaded here yet</h2>` +
      `<p>Looking in <code>${esc(DATA.root)}</code>${st.root_exists === false ? ", which doesn't exist" : ""}.</p>` +
      `<ul>${rows}${other}</ul>` +
      `<p>If <code>sync</code> is still running, choose Rescan to pick up what it has finished.</p>`;
  } else if (!list.length) {
    empty.innerHTML = `<h2>Nothing in your downloads matches that</h2><p><button class="linkish" data-clear="all">Clear filters</button></p>`;
  }
  empty.hidden = list.length > 0;
}

function renderFacets(list) {
  const tagCounts = countBy(list, "tags");
  for (const t of state.tags) if (!tagCounts.has(t)) tagCounts.set(t, 0);
  const tags = [...tagCounts].sort((x, y) => state.tags.has(y[0]) - state.tags.has(x[0]) || y[1] - x[1] || coll.compare(x[0], y[0]));
  const shown = state.allTags ? tags : tags.slice(0, 36);
  $("#tags").innerHTML = shown.map(([t, n]) =>
    `<button class="chip" data-tag="${esc(t)}" aria-pressed="${state.tags.has(t)}">${esc(t)}<span class="n">${n}</span></button>`).join("")
    || `<span class="none">No tags for these assets</span>`;
  const more = $("#moreTags");
  more.hidden = tags.length <= 36;
  more.textContent = state.allTags ? "Show fewer tags" : `Show all ${tags.length} tags`;

  const typeCounts = countBy(list, "types");
  for (const t of state.types) if (!typeCounts.has(t)) typeCounts.set(t, 0);
  $("#types").innerHTML = [...typeCounts].sort((x, y) => y[1] - x[1] || coll.compare(x[0], y[0])).map(([t, n]) =>
    `<button class="chip" data-type="${esc(t)}" aria-pressed="${state.types.has(t)}">.${esc(t)}<span class="n">${n}</span></button>`).join("");

  const creatorCounts = new Map();
  for (const a of DATA.assets) if (matches(a, "creator")) creatorCounts.set(a.creator, (creatorCounts.get(a.creator) || 0) + 1);
  if (state.creator && !creatorCounts.has(state.creator)) creatorCounts.set(state.creator, 0);
  const f = norm(state.creatorFind);
  $("#creators").innerHTML = [...creatorCounts].filter(([c]) => !f || norm(c).includes(f))
    .sort((x, y) => coll.compare(x[0], y[0])).map(([c, n]) =>
      `<li><button data-creator="${esc(c)}" aria-pressed="${state.creator === c}"><span>${esc(c)}</span><span class="n">${n}</span></button></li>`).join("");

  const total = DATA.assets.reduce((s, a) => s + a.size, 0);
  const missing = DATA.assets.reduce((s, a) => s + a.missing, 0);
  $("#totals").textContent = DATA.assets.length
    ? `${DATA.assets.length} things, ${fmtSize(total)} on disk.` + (missing ? ` ${missing} ${missing === 1 ? "file" : "files"} missing.` : "")
    : "";
}

function renderStatus(list) {
  const total = DATA.assets.length;
  const pills = [];
  if (state.q) pills.push(["q", "", `Search`, state.q]);
  if (state.store) pills.push(["store", "", "Store", state.store]);
  if (state.creator) pills.push(["creator", "", "Creator", state.creator]);
  for (const t of state.tags) pills.push(["tag", t, "Tag", t]);
  for (const t of state.types) pills.push(["type", t, "Type", "." + t]);
  const things = n => `${n} ${n === 1 ? "thing" : "things"}`;
  $("#count").hidden = !total;
  $("#count").innerHTML = filtersActive() ? `${list.length} <span class="of">of ${things(total)}</span>` : `${things(total)} on disk`;
  $("#status").innerHTML =
    pills.map(([k, v, label, text]) =>
      `<button class="pill" data-clear="${k}" data-v="${esc(v)}" aria-label="Remove ${label.toLowerCase()} filter ${esc(text)}">` +
      `<b>${label}</b> ${esc(text)}<span aria-hidden="true">×</span></button>`).join("") +
    (pills.length > 1 ? `<button class="linkish" data-clear="all">Clear all</button>` : "");
}

function syncControls() {
  const q = $("#q"); if (q.value !== state.q) q.value = state.q;
  for (const b of $("#stores").children) b.setAttribute("aria-checked", String(b.dataset.store === state.store));
  $("#sort").value = state.sort;
}

/* ---------- detail */
function showDetail(a, focus = true) {
  openId = a.id;
  const storeLink = safeUrl(a.url) ? `<a href="${esc(safeUrl(a.url))}" target="_blank" rel="noopener noreferrer">Open on ${a.store}</a>` : "";
  detail.innerHTML =
    `<button class="x" data-act="close" aria-label="Close details">×</button>` +
    `<div class="d-art">${a.thumb ? `<img src="${fileUrl(a.thumb)}" alt="">` : placeholder(a)}</div>` +
    `<h2 class="d-name">${esc(a.name)}</h2>` +
    `<p class="d-by">by ${esc(a.creator)}${a.variants ? `, ${esc(a.variants)}` : ""}</p>` +
    `<p class="d-store"><span class="dot ${a.store.toLowerCase()}"></span>${a.store} ${storeLink}</p>` +
    a.also_in.map(o => `<p class="also">You also have this from ${o.store}. ` +
      `<button class="linkish" data-act="goto" data-id="${o.id}">View that copy</button></p>`).join("") +
    `<div class="actions"><button class="primary" data-act="open" data-path="${esc(a.folder)}">Open folder</button>` +
      `<button class="ghost" data-act="copy">Copy path</button></div>` +
    (a.tags.length ? `<h3>Tags</h3><div class="chips">${a.tags.map(t =>
      `<button class="chip" data-act="tag" data-tag="${esc(t)}" aria-pressed="${state.tags.has(t)}">${esc(t)}</button>`).join("")}</div>` : "") +
    `<h3>Files<span class="muted">${a.files.length} ${a.files.length === 1 ? "file" : "files"}, ${fmtSize(a.size)}</span></h3>` +
    `<ul class="files">${a.files.map(f => `<li class="${f.missing ? "miss" : ""}"><span class="fn">${esc(f.path)}</span>` +
      `<span class="fs">${f.missing ? "Missing on disk" : fmtSize(f.size)}</span>` +
      (f.missing ? "<span></span>" : `<button class="ghost sm" data-act="open" data-path="${esc(a.folder + "/" + f.path)}">Show in folder</button>`) +
      `</li>`).join("")}</ul>` +
    `<p class="path" id="absPath">${esc(a.abs_folder)}</p>`;
  detail.classList.add("open"); document.body.classList.add("panel-open");
  $("#scrim").hidden = !matchMedia("(max-width: 820px)").matches;
  if (focus) detail.querySelector(".x").focus();
}
function closeDetail() {
  if (openId == null) return;
  detail.classList.remove("open"); document.body.classList.remove("panel-open"); $("#scrim").hidden = true;
  const back = grid.querySelector(`[data-id="${openId}"]`) || lastFocus;
  openId = null;
  if (back) back.focus();
}
async function reveal(path) {
  try {
    const r = await fetch("/api/open", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ path }) });
    const j = await r.json();
    toast(r.ok ? `Opened in ${j.opened_in}` : j.error);
  } catch (e) { toast("Couldn't reach the library server."); }
}
async function copyPath() {
  const text = byId.get(openId).abs_folder;
  try { await navigator.clipboard.writeText(text); }
  catch (e) {
    const sel = getSelection(); const range = document.createRange();
    range.selectNodeContents($("#absPath")); sel.removeAllRanges(); sel.addRange(range);
    document.execCommand("copy"); sel.removeAllRanges();
  }
  toast("Path copied");
}

/* ---------- URL state */
function saveHash() {
  const p = new URLSearchParams();
  if (state.q) p.set("q", state.q);
  if (state.store) p.set("store", state.store);
  if (state.creator) p.set("creator", state.creator);
  if (state.tags.size) p.set("tags", [...state.tags].join(","));
  if (state.types.size) p.set("types", [...state.types].join(","));
  if (state.sort !== "name") p.set("sort", state.sort);
  const h = p.toString();
  history.replaceState(null, "", h ? "#" + h : location.pathname);
}
function readHash() {
  const p = new URLSearchParams(location.hash.slice(1));
  state.q = p.get("q") || ""; state.store = p.get("store") || ""; state.creator = p.get("creator") || "";
  state.tags = new Set((p.get("tags") || "").split(",").filter(Boolean));
  state.types = new Set((p.get("types") || "").split(",").filter(Boolean));
  state.sort = SORTS[p.get("sort")] ? p.get("sort") : "name";
}

/* ---------- events */
let qTimer;
$("#q").addEventListener("input", e => { clearTimeout(qTimer); qTimer = setTimeout(() => { state.q = e.target.value; render(); }, 90); });
$("#stores").addEventListener("click", e => { const b = e.target.closest("[data-store]"); if (b) { state.store = b.dataset.store; render(); } });
$("#sort").addEventListener("change", e => { state.sort = e.target.value; render(); });
$("#creatorFind").addEventListener("input", e => { state.creatorFind = e.target.value; render(); });
$("#moreTags").addEventListener("click", () => { state.allTags = !state.allTags; render(); });
$("#rescan").addEventListener("click", async () => { const n = await load(true); toast(`Rescanned ${n} assets`); });
$("#filtersToggle").addEventListener("click", e => {
  const open = $("#filters").classList.toggle("open"); e.currentTarget.setAttribute("aria-expanded", String(open));
});
const zoom = $("#zoom");
function setZoom(v) { document.documentElement.style.setProperty("--slot-size", v + "px"); zoom.value = v; }
zoom.addEventListener("input", () => { setZoom(zoom.value); try { localStorage.setItem("hoard-dl-tile-size", zoom.value); } catch (e) {} });
try { const z = localStorage.getItem("hoard-dl-tile-size"); if (z) setZoom(z); } catch (e) {}

function toggle(set, v) { set.has(v) ? set.delete(v) : set.add(v); }
$("#filters").addEventListener("click", e => {
  const t = e.target.closest("[data-tag]"), ty = e.target.closest("[data-type]"), c = e.target.closest("[data-creator]");
  if (t) toggle(state.tags, t.dataset.tag);
  else if (ty) toggle(state.types, ty.dataset.type);
  else if (c) state.creator = state.creator === c.dataset.creator ? "" : c.dataset.creator;
  else return;
  render();
});
document.addEventListener("click", e => {
  const b = e.target.closest("[data-clear]"); if (!b) return;
  const k = b.dataset.clear, v = b.dataset.v;
  if (k === "all") { state.q = ""; state.store = ""; state.creator = ""; state.tags.clear(); state.types.clear(); }
  else if (k === "q") state.q = ""; else if (k === "store") state.store = ""; else if (k === "creator") state.creator = "";
  else if (k === "tag") state.tags.delete(v); else if (k === "type") state.types.delete(v);
  render();
});
grid.addEventListener("click", e => {
  const s = e.target.closest(".slot"); if (!s) return;
  lastFocus = s; showDetail(byId.get(+s.dataset.id));
});
grid.addEventListener("error", e => {  // thumbnail missing or unreadable: fall back to the placeholder
  if (e.target.tagName !== "IMG") return;
  const a = byId.get(+e.target.closest(".slot").dataset.id);
  e.target.outerHTML = placeholder(a);
}, true);
detail.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  const act = b.dataset.act;
  if (act === "close") closeDetail();
  else if (act === "open") reveal(b.dataset.path);
  else if (act === "copy") copyPath();
  else if (act === "goto") showDetail(byId.get(+b.dataset.id));
  else if (act === "tag") { toggle(state.tags, b.dataset.tag); b.setAttribute("aria-pressed", String(state.tags.has(b.dataset.tag))); render(); }
});
$("#scrim").addEventListener("click", closeDetail);
document.addEventListener("keydown", e => {
  const typing = /^(INPUT|SELECT|TEXTAREA)$/.test(document.activeElement.tagName);
  if (e.key === "/" && !typing) { e.preventDefault(); $("#q").focus(); $("#q").select(); }
  else if (e.key === "Escape") { if (openId != null) closeDetail(); else if (document.activeElement === $("#q")) { state.q = ""; render(); } }
});

new ResizeObserver(([e]) => document.documentElement.style.setProperty("--bar-h", e.target.offsetHeight + "px")).observe($(".bar"));
readHash();
load();
</script>
</body>
</html>
