# Hoard's share server: short links for shared sets (worker.mjs). How to set it up and deploy it: README.md here.
name = "hoard-share"
main = "worker.mjs"
compatibility_date = "2026-09-01"

# Only at its own address (no workers.dev one): Cloudflare makes the DNS record and the certificate for it
workers_dev = false
routes = [{ pattern = "hoard-share.furryup.link", custom_domain = true }]

# Where the locked sets are kept. The id isn't a secret: it's what `npx wrangler kv namespace create hoard-share`
# printed (README.md, step 2).
[[kv_namespaces]]
binding = "SETS"
id = "PUT-THE-NAMESPACE-ID-HERE"

# At most 10 short links made, updated or deleted a minute from one address
[[ratelimits]]
name = "WRITES"
namespace_id = "4021"
simple = { limit = 10, period = 60 }

# Nothing is logged
[observability]
enabled = false
