<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Hoard film</title>
<!-- Hoard's videos, drawn here frame by frame: promo/build.py opens this page, calls setup() with a film from
     promo/films/, a language and a shape, then seek(t) for every frame and takes a picture of it. Everything on screen
     is Hoard's own screenshots (scripts/screenshots.py) and shapes drawn in HTML and SVG: nothing generated.
     Two looks: "promo" (dark, moving with the music) and "help" (light and calm: a screen, a pointer, the steps). -->
<style>
@font-face { font-family: "Dela Gothic One"; src: url(../../hoard/web/fonts/DelaGothicOne-Regular.woff2) format("woff2"); }
@font-face { font-family: "Zen Maru Gothic"; font-weight: 500; src: url(../../hoard/web/fonts/ZenMaruGothic-Medium.woff2) format("woff2"); }
@font-face { font-family: "Zen Maru Gothic"; font-weight: 700; src: url(../../hoard/web/fonts/ZenMaruGothic-Bold.woff2) format("woff2"); }
:root {
  --cave: #211C18; --ledge: #2B2520; --stone: #372F28; --seam: #4A4037;
  --bone: #F4EDE3; --dust: #B3A695; --gold: #F0B429; --gold-ink: #2A1D00; --gold-text: #F0B429;
  --display: "Dela Gothic One", "Noto Sans CJK JP", sans-serif;
  --body: "Zen Maru Gothic", "Noto Sans CJK JP", sans-serif;
}
:root[lang=ja] #stage { word-break: auto-phrase; }   /* Japanese lines break between phrases, not inside a word */
:root[lang=ko] { --display: "Noto Sans CJK KR", sans-serif; --display-weight: 900; --body: "Noto Sans CJK KR", sans-serif; }
/* the help look: Hoard's light theme */
.help { --cave: #EEECE8; --ledge: #FFFFFF; --stone: #E3DFD8; --seam: #D2CCC3; --bone: #211C18; --dust: #6B6157; --gold-text: #8A5F00; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: #000; overflow: hidden; }
#stage { position: relative; overflow: hidden; background: var(--cave); color: var(--bone); font-family: var(--body); font-weight: 500; }
.abs { position: absolute; }
.scene { position: absolute; inset: 0; display: none; }
.glow { position: absolute; width: 1300px; height: 1300px; border-radius: 50%; margin: -650px 0 0 -650px; }
#grain { position: absolute; inset: -64px; background: url(../../build/promo/grain.png); opacity: .07; mix-blend-mode: overlay; }
#vig { position: absolute; inset: 0; background: radial-gradient(ellipse 75% 70% at 50% 50%, rgba(0,0,0,0) 55%, rgba(8,6,5,.55) 100%); }
.help #grain, .help #vig, .help #bg { display: none; }
#fade { position: absolute; inset: 0; background: #000; opacity: 0; }
.help #fade { background: #EEECE8; }
.display { font-family: var(--display); font-weight: var(--display-weight, 400); line-height: 1.1; letter-spacing: -.005em; }
.wm { display: inline-block; overflow: hidden; vertical-align: top; padding: .14em .05em .2em; margin: -.14em -.05em -.2em; }
.wi { display: inline-block; }
.center { left: 0; right: 0; text-align: center; }
.chip { position: absolute; left: 0; top: 0; display: flex; align-items: center; gap: .4em; padding: 0 .85em 0 .66em; height: 1.95em;
  border-radius: 999px; background: var(--ledge); border: 2px solid var(--seam); font-weight: 700; white-space: nowrap;
  box-shadow: 0 24px 50px rgba(0,0,0,.45); transform-origin: 50% 50%; }
.chip i { width: .44em; height: .44em; border-radius: 50%; display: block; flex: none; }
.chip .tag { font-size: .6em; padding: .18em .6em .22em; border-radius: .5em; background: var(--gold); color: var(--gold-ink); letter-spacing: .02em; }
.chip .face { display: flex; align-items: center; gap: .4em; }
.cap .kicker { display: flex; align-items: center; gap: .5em; font-weight: 700; color: var(--gold-text); letter-spacing: .02em; }
.cap .kicker b { display: inline-block; width: .7em; height: .7em; border-radius: .2em; background: var(--gold); }
.cap .title { font-family: var(--display); font-weight: var(--display-weight, 400); line-height: 1.06; }
.cap .body { color: var(--dust); line-height: 1.45; }
.cap .points { display: flex; flex-direction: column; }
.cap .point { display: flex; align-items: flex-start; gap: .55em; font-weight: 700; line-height: 1.3; color: var(--dust); }
.cap .point.on { color: var(--bone); }
.cap .point svg { flex: none; width: 1.2em; height: 1.2em; margin-top: .02em; }
.window { position: absolute; overflow: hidden; border-radius: 22px; border: 2px solid var(--seam); background: var(--ledge);
  box-shadow: 0 40px 100px rgba(0,0,0,.55), 0 10px 30px rgba(0,0,0,.35); }
.help .window { box-shadow: 0 24px 60px rgba(60,40,20,.16), 0 4px 14px rgba(60,40,20,.08); }
.shotimg { position: absolute; left: 0; top: 0; width: 1600px; height: 950px; transform-origin: 0 0; }
.ring { position: absolute; border-radius: 12px; pointer-events: none; }
.lens { position: absolute; overflow: hidden; border-radius: 20px; background: var(--ledge);
  box-shadow: 0 0 0 4px var(--gold), 0 28px 70px rgba(0,0,0,.55); }
.help .lens { box-shadow: 0 0 0 4px var(--gold), 0 20px 50px rgba(60,40,20,.25); }
.lens img { position: absolute; left: 0; top: 0; width: 1600px; height: 950px; transform-origin: 0 0; }
.cursor { position: absolute; left: 0; top: 0; width: 44px; height: 44px; pointer-events: none; }
.ripple { position: absolute; border-radius: 50%; border: 4px solid var(--gold); pointer-events: none; }
.pill { display: inline-block; border-radius: 999px; background: var(--gold); color: var(--gold-ink); font-family: var(--display); font-weight: var(--display-weight, 400); }
.credit { position: absolute; color: rgba(179,166,149,.62); white-space: nowrap; }
.help .credit { color: rgba(107,97,87,.75); }
.panel { position: absolute; background: var(--ledge); border: 2px solid var(--seam); border-radius: 22px; box-shadow: 0 24px 60px rgba(60,40,20,.12); }
.steps { display: flex; flex-direction: column; }
.step { display: flex; align-items: flex-start; gap: .6em; color: var(--dust); font-weight: 700; line-height: 1.3; }
.step .n { flex: none; width: 1.7em; height: 1.7em; border-radius: 50%; border: 2px solid var(--seam); display: flex; align-items: center; justify-content: center;
  font-size: .9em; color: var(--dust); background: var(--ledge); }
.step.now { color: var(--bone); }
.step.now .n { background: var(--gold); border-color: var(--gold); color: var(--gold-ink); }
.step.done .n { background: var(--stone); border-color: var(--stone); color: var(--bone); }
/* a drawing of a window outside Hoard (a store's page, a system dialog, a terminal): plain shapes and words, never
   anyone's own design */
.dw { position: absolute; display: flex; flex-direction: column; gap: 20px; color: #211C18; }
.dw .wt { font-family: var(--display); font-weight: var(--display-weight, 400); font-size: 40px; line-height: 1.12; }
.dw .wl { font-size: 25px; line-height: 1.45; color: #6B6157; }
.dw .wfl { font-size: 21px; font-weight: 700; color: #6B6157; margin-bottom: 8px; }
.dw .wbox { height: 58px; border-radius: 12px; background: #FFFFFF; border: 2px solid #D2CCC3; display: flex; align-items: center;
  padding: 0 18px; font-size: 24px; letter-spacing: .02em; white-space: nowrap; overflow: hidden; }
.dw .wbtns { display: flex; gap: 14px; flex-wrap: wrap; }
.dw .wb { height: 58px; padding: 0 28px; border-radius: 12px; border: 2px solid #D2CCC3; background: #FFFFFF; font-weight: 700;
  font-size: 24px; display: flex; align-items: center; white-space: nowrap; }
.dw .wb.primary { background: #E3DFD8; border-color: #E3DFD8; }
.dw .wlk { color: #8A5F00; text-decoration: underline; text-underline-offset: .18em; font-weight: 700; font-size: 25px; align-self: flex-start; }
.dw .wrow { display: flex; align-items: center; gap: 20px; padding: 16px 20px; border-radius: 16px; background: #FFFFFF; border: 2px solid #E3DFD8; }
.dw .wrow .ic { width: 64px; height: 64px; flex: none; display: flex; align-items: center; justify-content: center; border-radius: 14px; background: #211C18; }
.dw .wrow b { display: block; font-size: 28px; } .dw .wrow span { font-size: 21px; color: #6B6157; }
.dw .wsr { height: 64px; border-radius: 32px; background: #FFFFFF; border: 2px solid #D2CCC3; display: flex; align-items: center; gap: 14px;
  padding: 0 24px; font-size: 27px; }
.dw .wkv { display: grid; grid-template-columns: auto 1fr; gap: 10px 22px; font-size: 24px; } .dw .wkv dt { color: #6B6157; } .dw .wkv dd { font-weight: 700; }
.dw .wterm { font-family: "DejaVu Sans Mono", "Noto Sans Mono CJK JP", monospace; font-size: 23px; line-height: 1.6; color: #E3DACB; white-space: pre-wrap; word-break: break-all; }
.dw .wterm .m { color: #F0B429; border-radius: 6px; }
.dw .on { box-shadow: 0 0 0 4px #F0B429; }
.dw .wb.on { background: #F0B429; border-color: #F0B429; color: #2A1D00; }
.lookchip { position: absolute; padding: .3em .8em .36em; border-radius: 999px; background: var(--ledge); border: 2px solid var(--seam);
  font-weight: 700; white-space: nowrap; box-shadow: 0 10px 26px rgba(0,0,0,.4); }
</style>
</head>
<body>
<div id="stage">
  <div id="bg"></div>
  <div id="frame"></div>
  <div id="scenes"></div>
  <div id="chrome"></div>
  <div id="grain"></div>
  <div id="vig"></div>
  <div id="fade"></div>
</div>
<script>
"use strict";
const $ = id => document.getElementById(id);
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const P = (t, a, b) => clamp((t - a) / (b - a));
const lerp = (a, b, p) => a + (b - a) * p;
const eOut3 = p => 1 - Math.pow(1 - p, 3);
const eIn3 = p => p * p * p;
const eIn2 = p => p * p;
const eIO3 = p => p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
const eBack = (p, s = 1.7) => p <= 0 ? 0 : 1 + (s + 1) * Math.pow(p - 1, 3) + s * Math.pow(p - 1, 2);
const spring = (p, k = 3.2, z = 5.5) => p <= 0 ? 0 : p >= 1 ? 1 : 1 - Math.exp(-z * p) * Math.cos(k * Math.PI * p);
const el = (tag, cls, css, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (css) e.style.cssText = css; if (html != null) e.innerHTML = html; return e; };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const hex = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
const mix = (a, b, p) => { const A = hex(a), B = hex(b); return `rgb(${A.map((v, i) => Math.round(lerp(v, B[i], p))).join(",")})`; };
const C = { booth: "#FF6259", gumroad: "#FF8AD8", jinxxy: "#56D1DC", payhip: "#95A0FF", itch: "#7ED67A", gold: "#F0B429", local: "#E8C26A" };
const CAVE = "#211C18", SPARK = "#FFF8E6";
const STORE_NAMES = { booth: "Booth", gumroad: "Gumroad", jinxxy: "Jinxxy", payhip: "Payhip", itch: "itch.io" };
const CHECK = '<svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="19" fill="#F0B429"/><path d="M11.5 20.5l6 6 11-12" fill="none" stroke="#2A1D00" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const CURSOR = '<svg viewBox="0 0 24 24" width="44" height="44"><path d="M4 2.5l15.5 11.2-6.6 1.1 3.9 6.7-3 1.7-3.9-6.8-5 4.4z" fill="#FFFFFF" stroke="#211C18" stroke-width="1.6" stroke-linejoin="round"/></svg>';

let F, LANG, W, H, PORTRAIT, HELP, BEAT, BAR, SC = [], T_END = 0, VT = 0, HF = null;
const XF = .5;   // a help video's crossfade from one step's screen to the next
window.warnings = [];
// a film's words, in this language (falling back to English)
const T = s => (s && typeof s === "object" && !Array.isArray(s) && "en" in s) ? (s[LANG] ?? s.en) : s;

// ---------------- the Heap: Hoard's logo (issues #277, #280), as hoard/heap.py draws it everywhere (build.py passes
// it in): a box for each store, the Projects box with its cube, and on top the gold box, for your own files
function heapSVG(withWord, ink = "#F4EDE3") {
  const boxes = `<g class="boxes">${F.heap.svg}</g>`;
  if (!withWord) return `<svg viewBox="0 8 64 48" style="overflow:visible;width:100%;height:auto;display:block">${boxes}</svg>`;
  return `<svg viewBox="0 0 226 64" style="overflow:visible;width:100%;height:auto;display:block">${boxes}<g class="wmk" fill="${ink}">${F.heap.word}</g></svg>`;
}

// ---------------- text
function jaPhrases(text) {   // Japanese in phrases: each word with the particles and marks after it (サインインを / 選ぶ)
  const out = [];
  for (const { segment: t, isWordLike } of new Intl.Segmenter("ja", { granularity: "word" }).segment(text)) {
    if (/^\s+$/.test(t)) { out.push(t); continue; }
    const last = out[out.length - 1];
    if (last && !/^\s+$/.test(last) && (!isWordLike || /^[ぁ-ゖー]+$/.test(t))) out[out.length - 1] = last + t;
    else out.push(t);
  }
  return out;
}
function words(node) {   // each word (in Japanese, each phrase) in a mask of its own, for a reveal: lines break between them
  const walk = n => [...n.childNodes].forEach(c => {
    if (c.nodeType === 3) {
      const parts = LANG === "ja" ? jaPhrases(c.textContent) : c.textContent.split(/(\s+)/);
      const f = document.createDocumentFragment();
      parts.forEach(p => { if (!p) return; if (/^\s+$/.test(p)) { f.appendChild(document.createTextNode(p)); return; }
        const m = el("span", "wm"), i = el("span", "wi"); i.textContent = p; m.appendChild(i); f.appendChild(m); });
      c.replaceWith(f);
    } else if (c.nodeType === 1) walk(c);
  });
  walk(node); node._w = [...node.querySelectorAll(".wi")]; return node;
}
function reveal(node, t, t0, t1 = null, st = .08, d = .7) {
  node._w.forEach((w, i) => {
    const pi = eOut3(P(t, t0 + i * st, t0 + i * st + d));
    const po = t1 == null ? 0 : eIn3(P(t, t1 + i * st * .4, t1 + i * st * .4 + .35));
    w.style.transform = `translateY(${(1 - pi) * 190 - po * 190}%)`;
    w.style.opacity = pi > 0 && po < 1 ? 1 : 0;
  });
}
function rise(node, t, tin, tout, o = {}) {
  const di = o.di ?? .6, y = o.y ?? 26, x = o.x ?? 0;
  const pi = eOut3(P(t, tin, tin + di)), po = tout == null ? 0 : eIn3(P(t, tout, tout + .35));
  node.style.opacity = (pi * (1 - po)).toFixed(4);
  node.style.transform = `translate(${x * (1 - pi)}px,${y * (1 - pi) - (o.oy ?? 18) * po}px)`;
  return pi * (1 - po);
}
const fadeIO = (t, tin, tout, d = .45) => P(t, tin, tin + d) * (tout == null ? 1 : 1 - P(t, tout, tout + d));

// ---------------- screens: a whole screenshot in a window, a ring round what's meant, a lens on it
function focusList(s) {
  const reg = F.regions[s.image] || {};
  return (s.focus || []).map(f => {
    const o = Array.isArray(f) ? { at: f[0], box: f[1], pad: f[2], lens: f[3] } : f;
    const r = reg[o.box], lname = typeof o.lens === "string" ? o.lens : o.box, lr = reg[lname];
    if (!r) window.warnings.push(`${s.image}: no box for "${o.box}" (${LANG})`);
    if (o.lens !== false && !lr) window.warnings.push(`${s.image}: no box for "${lname}" (${LANG})`);
    // the lens always shows a whole thing on the page (a row, a card, a bar), never a cut through the middle of one
    return { t: o.at * BEAT, r: r || [0, 0, 1600, 950], pad: o.pad ?? 8, click: !!o.click, lens: o.lens !== false,
             lr: lr || r || [0, 0, 1600, 950], lpad: o.lensPad ?? LENS_BLEED };
  });
}
function screenBuild(s, root, box) {   // box: the window's [left, top, width] on the frame; its height follows the screen's
  const z = box[2] / 1600;
  s.box = [box[0], box[1], box[2], 950 * z]; s.z = z;
  s.focusR = focusList(s);
  const src = `${F.shots}/${s.image}-${F.film.theme || "dark"}${LANG === "en" ? "" : "-" + LANG}.png`;
  s.win = el("div", "window", `left:${s.box[0]}px;top:${s.box[1]}px;width:${s.box[2]}px;height:${s.box[3]}px`,
    `<img class="shotimg" src="${src}" style="transform:scale(${z})"><div class="abs dim" style="inset:0"></div>`);
  s.dim = s.win.querySelector(".dim");
  s.ring = el("div", "ring");
  // the lens: just the element it shows (cut to its edges), on the lens's own plain ground
  s.lens = el("div", "lens", "", `<div class="abs lclip"><img src="${src}"><div class="ring lring"></div></div>`);
  s.lensClip = s.lens.firstChild; s.lensImg = s.lensClip.firstChild; s.lensRing = s.lens.querySelector(".lring");
  root.append(s.win, s.ring, s.lens);
  if (HELP) { s.cursor = el("div", "cursor", "", CURSOR); s.ripple = el("div", "ripple"); root.append(s.ripple, s.cursor); }
}
function focusAt(s, t, moveFor) {   // what's pointed at now, gliding from one to the next
  if (!s.focusR.length) return null;
  let r = s.focusR[0].r.slice(), pad = s.focusR[0].pad, lr = s.focusR[0].lr.slice(), lpad = s.focusR[0].lpad, idx = 0;
  for (let i = 1; i < s.focusR.length; i++) {
    const p = eIO3(P(t, s.focusR[i].t - moveFor, s.focusR[i].t));
    if (p > 0) {
      r = r.map((v, k) => lerp(v, s.focusR[i].r[k], p)); pad = lerp(pad, s.focusR[i].pad, p);
      lr = lr.map((v, k) => lerp(v, s.focusR[i].lr[k], p)); lpad = lerp(lpad, s.focusR[i].lpad, p);
    }
    if (t >= s.focusR[i].t - moveFor / 2) idx = i;
  }
  return { r, pad, lr, lpad, idx };
}
const LENS_BLEED = 10, LENS_EDGE = 16;   // the screen round what a lens shows (faded out), and its plain margin
function lensPlace(s, r, pad) {   // the lens: its size, its place on the frame, and how much bigger than the screen it shows
  const [wx, wy, ww, wh] = s.box, z = s.z;
  const rw = r[2] + 2 * pad, rh = r[3] + 2 * pad;
  let L = clamp(Math.min((PORTRAIT ? 640 : 560) / rw, (PORTRAIT ? 260 : 230) / rh), z * 1.6, 1.9);
  L = Math.min(L, (ww * .92 - 2 * LENS_EDGE) / rw);
  const lw = rw * L + 2 * LENS_EDGE, lh = rh * L + 2 * LENS_EDGE;
  const sx = wx + (r[0] + r[2] / 2) * z, sy = wy + (r[1] - pad) * z, sb = wy + (r[1] + r[3] + pad) * z;
  const x = HELP ? clamp(sx - lw / 2, wx + 14, wx + ww - 14 - lw) : clamp(sx - lw / 2, Math.max(24, wx - 30), Math.min(W - 24, wx + ww + 30) - lw);
  const bottom = Math.min(H - (HELP ? 50 : 70), wy + wh + 50);
  const top = HELP ? wy + 8 : 24;   // (in a help video, never over its header)
  let y = sb + 24;
  if (y + lh > bottom) y = sy - 24 - lh;
  if (y < top) y = clamp(sb + 24, top, bottom - lh);
  return { x, y, lw, lh, L, cx: sx, cy: (sy + sb) / 2 };
}
function screenDraw(s, t, o) {   // o: { tout, move }
  const f = focusAt(s, t, o.move);
  const z = s.z, [wx, wy] = s.box;
  if (!f) { s.ring.style.opacity = s.lens.style.opacity = 0; s.dim.style.background = "none"; return; }
  const f0 = s.focusR[0].t;
  const on = P(t, f0, f0 + .35) * (1 - P(t, o.tout - .3, o.tout));
  const [x, y, w, h] = [wx + (f.r[0] - f.pad) * z, wy + (f.r[1] - f.pad) * z, (f.r[2] + 2 * f.pad) * z, (f.r[3] + 2 * f.pad) * z];
  s.ring.style.cssText = `left:${x}px;top:${y}px;width:${w}px;height:${h}px;opacity:${on.toFixed(3)};box-shadow:0 0 0 4px var(--gold),0 0 34px 6px rgba(240,180,41,${HELP ? .25 : .45})`;
  s.dim.style.background = `rgba(${HELP ? "40,30,20" : "12,9,7"},${(on * (HELP ? .1 : .3)).toFixed(3)})`;
  // the lens opens after the ring lands, and closes while the ring moves on
  const lp = lensPlace(s, f.lr, f.lpad);
  let lensOn = 0;
  s.focusR.forEach((q, i) => {
    if (!q.lens) return;
    const next = s.focusR[i + 1], a = q.t + .4, b = next ? next.t - o.move : o.tout - .35;
    lensOn = Math.max(lensOn, eBack(P(t, a, a + .5), 1.4) * (1 - eIn3(P(t, b, b + .3))));
  });
  const ls = .6 + .4 * clamp(lensOn, 0, 1.2);
  s.lens.style.cssText = `left:${lp.x}px;top:${lp.y}px;width:${lp.lw}px;height:${lp.lh}px;opacity:${clamp(lensOn * 1.5).toFixed(3)};` +
    `transform-origin:${lp.cx - lp.x}px ${lp.cy - lp.y}px;transform:scale(${ls.toFixed(4)})`;
  const fe = Math.max(1, f.lpad * lp.L).toFixed(1);   // the bleed fades out, so nothing ends in a hard cut
  s.lensClip.style.cssText = `overflow:hidden;left:${LENS_EDGE}px;top:${LENS_EDGE}px;width:${lp.lw - 2 * LENS_EDGE}px;height:${lp.lh - 2 * LENS_EDGE}px;` +
    `-webkit-mask-image:linear-gradient(90deg,transparent,#000 ${fe}px,#000 calc(100% - ${fe}px),transparent),linear-gradient(180deg,transparent,#000 ${fe}px,#000 calc(100% - ${fe}px),transparent);` +
    `-webkit-mask-composite:source-in;mask-composite:intersect`;
  const ox = -(f.lr[0] - f.lpad) * lp.L, oy = -(f.lr[1] - f.lpad) * lp.L;
  s.lensImg.style.transform = `translate(${ox}px,${oy}px) scale(${lp.L})`;
  const sameBox = f.r.every((v, k) => Math.abs(v - f.lr[k]) < 1);   // a ring inside the lens, when it shows more than what's meant
  s.lensRing.style.cssText = `left:${ox + (f.r[0] - f.pad) * lp.L}px;top:${oy + (f.r[1] - f.pad) * lp.L}px;width:${(f.r[2] + 2 * f.pad) * lp.L}px;` +
    `height:${(f.r[3] + 2 * f.pad) * lp.L}px;opacity:${sameBox ? 0 : 1};box-shadow:0 0 0 3px var(--gold)`;
  if (HELP) {   // the pointer glides to what's clicked, and clicks it
    const clicks = s.focusR.filter(q => q.click);
    let px = wx + s.box[2] * .62, py = wy + s.box[3] * .82, show = 0, click = 0, cx = 0, cy = 0, press = 0;
    clicks.forEach(q => {
      const tx = wx + (q.r[0] + q.r[2] / 2) * z, ty = wy + (q.r[1] + q.r[3] * .6) * z;
      const m = eIO3(P(t, q.t - 1.3, q.t - .15));
      px = lerp(px, tx, m); py = lerp(py, ty, m);
      show = Math.max(show, P(t, q.t - 1.6, q.t - 1.3));
      press = Math.max(press, Math.sin(Math.PI * P(t, q.t - .1, q.t + .15)));
      const c = P(t, q.t - .1, q.t + .6); if (c > 0 && c < 1) { click = c; cx = tx; cy = ty; }
    });
    show *= 1 - P(t, o.tout - .4, o.tout);
    s.cursor.style.opacity = show.toFixed(3);
    s.cursor.style.transform = `translate(${px - 6}px,${py - 4}px) scale(${1 - .12 * press})`;
    const rr = 16 + 46 * eOut3(click);
    s.ripple.style.cssText = `left:${cx - rr}px;top:${cy - rr}px;width:${rr * 2}px;height:${rr * 2}px;opacity:${click > 0 ? (1 - click).toFixed(3) : 0}`;
  }
}

// ---------------- the promo's scenes
const BUILD = {}, DRAW = {};
const CHIP_ORDER = ["booth", "gumroad", "jinxxy", "payhip", "itch", "projects", "gold"];   // the order they pop up in
const CHIP_AT = {   // where each chip pops up: under the Heap, so a box waiting its turn is never where one lands
  landscape: { booth: [400, 700], gumroad: [930, 760], jinxxy: [1480, 700], payhip: [560, 880], itch: [1180, 890], projects: [1620, 850], gold: [880, 975] },
  portrait: { booth: [290, 1180], gumroad: [790, 1260], jinxxy: [280, 1380], payhip: [800, 1460], itch: [300, 1580], projects: [790, 1660], gold: [540, 1775] } };
const HEAP_AT = { landscape: [960, 400, 9.5], portrait: [540, 760, 14] };   // the Heap's middle, and its size

// The opening: the stores one by one, your projects, then your own files; each turns into its box and drops into
// the Heap, the bottom row first and your files last, on top.
BUILD.intro = (s, root) => {
  const tx = T(s.text), fs = PORTRAIT ? 96 : 100;
  s.lines = el("div", "abs center display", `top:${PORTRAIT ? 300 : 110}px;font-size:${fs}px;padding:0 50px`);
  s.l1 = words(el("div", "", "white-space:nowrap", esc(tx.stores)));   // a line each, never broken mid-word: see fitLines
  s.l2 = words(el("div", "", "white-space:nowrap", esc(tx.projects)));
  s.l3 = words(el("div", "", "white-space:nowrap;color:var(--gold)", esc(tx.local)));
  s.lines.append(s.l1, s.l2, s.l3);
  s.tag = words(el("div", "abs center display", `top:${PORTRAIT ? 1150 : 700}px;font-size:${PORTRAIT ? 70 : 60}px;padding:0 70px`, esc(tx.tagline)));
  root.append(s.lines, s.tag);
  const [hx, hy, k] = HEAP_AT[PORTRAIT ? "portrait" : "landscape"], x0 = hx - 32 * k, y0 = hy - 32 * k;   // its 64 x 64 square
  s.k = k;
  s.items = F.heap.boxes.map((b, drop) => {
    const c = b.box, i = CHIP_ORDER.indexOf(c), inner = b.size * k;
    const name = c === "gold" ? tx.chip : c === "projects" ? tx.projectsChip : STORE_NAMES[c];
    const dot = c === "projects"   // the Projects chip has the box's cube, in the box's colour
      ? `<svg viewBox="${-b.size * .32} ${-b.size * .32} ${b.size * .64} ${b.size * .64}" style="width:.62em;height:.62em;flex:none;overflow:visible">${b.extra.replace(/stroke="[^"]+"/, `stroke="${b.fill}"`).replace(/stroke-width="[^"]+"/, `stroke-width="${b.size * .09}"`)}</svg>`
      : `<i style="background:${b.fill};box-shadow:0 0 0 .15em ${b.fill}33"></i>`;
    const chip = el("div", "chip", `font-size:${PORTRAIT ? 50 : 46}px`,
      `<span class="face">${dot}${esc(name)}` + (c === "gold" ? `<span class="tag">${esc(tx.tag)}</span>` : "") + `</span>`);
    root.appendChild(chip);
    const it = { c, i, drop, chip, face: chip.firstChild, fill: b.fill, at: CHIP_AT[PORTRAIT ? "portrait" : "landscape"][c],
      r0: [-6, 4, -5, 5, -3, 4, 3][i], rot: b.tilt, slot: [x0 + b.x * k, y0 + b.y * k],
      size: (b.size + b.line) * k, radius: (b.round + b.line / 2) * k, line: b.line * k };
    if (b.extra) {   // the gold box's sparkle, the Projects box's cube
      it.extra = el("div", "abs", `left:50%;top:50%;width:${inner}px;height:${inner}px;margin:${-inner / 2}px 0 0 ${-inner / 2}px;opacity:0`,
        `<svg viewBox="${-b.size / 2} ${-b.size / 2} ${b.size} ${b.size}" style="width:100%;height:100%;overflow:visible;display:block">${b.extra}</svg>`);
      chip.appendChild(it.extra);

};
DRAW.intro = (s, t) => {
  if (!s.fit) {   // once it's laid out: the opening's lines a size that fits the frame's width (narrower in portrait)
    s.fit = true;
    const width = n => { n.style.display = "inline-block"; const w = n.offsetWidth; n.style.display = ""; return w; };   // (its words', not the frame's)
    const widest = Math.max(...[s.l1, s.l2, s.l3].map(width)), room = W - 100;
    if (widest > room) s.lines.style.fontSize = (parseFloat(s.lines.style.fontSize) * room / widest) + "px";
  }
  const d = s.dur, B = BEAT;
  const tTurn = 8 * B;                                  // bar 2: the words go and the chips turn into boxes
  reveal(s.l1, t, .1, tTurn - .6);
  reveal(s.l2, t, 4.3 * B, tTurn - .6);
  reveal(s.l3, t, 4.9 * B, tTurn - .6);
  const out = eIn3(P(t, d - .45, d)), last = s.items.length - 1;
  s.items.forEach(it => {
    const tPop = it.c === "gold" ? 5.5 * B : it.c === "projects" ? 4.5 * B : (.8 + it.i * .7) * B;
    const pin = eBack(P(t, tPop, tPop + .5), 2.2);
    const tMorph = tTurn + it.i * .09, morph = eIO3(P(t, tMorph, tMorph + .65));
    const tDrop = tTurn + 1.2 + it.drop * .4 + (it.drop === last ? .3 : 0), fall = P(t, tDrop, tDrop + .7);
    const cw = it.chip.offsetWidth || 1, ch = it.chip.offsetHeight || 1;
    if (!it.cw) { it.cw = cw; it.ch = ch; }             // the chip's own size, before it starts to turn
    const w = lerp(it.cw, it.size, morph), h = lerp(it.ch, it.size, morph);
    const st = it.chip.style;
    st.width = w + "px"; st.height = h + "px"; st.marginLeft = (-w / 2) + "px"; st.marginTop = (-h / 2) + "px";
    st.padding = morph > 0 ? "0" : ""; st.justifyContent = "center";
    st.borderRadius = lerp(it.ch / 2, it.radius, morph) + "px";
    st.background = morph > 0 ? mix("#2B2520", it.fill, morph) : "";
    st.borderColor = morph > 0 ? mix("#4A4037", CAVE, morph) : "";
    st.borderWidth = lerp(2, it.line, morph) + "px";
    st.boxShadow = `0 ${24 - 14 * morph}px ${50 - 20 * morph}px rgba(0,0,0,${.45 - .15 * morph})`;
    it.face.style.opacity = (1 - P(t, tMorph, tMorph + .3)).toFixed(3);
    it.face.style.display = morph >= .5 ? "none" : "flex";
    // where it is: where it popped up, bobbing; then up and over, and down into its place in the Heap
    const bob = Math.sin(VT * 2.2 + it.i * 1.7) * 7 * (1 - P(t, tDrop - .2, tDrop));
    let x = it.at[0], y = it.at[1] + bob;
    if (fall > 0) {
      const apex = Math.max(Math.min(it.at[1], it.slot[1]) - (PORTRAIT ? 360 : 280), it.size / 2 + 40);   // (never off the top)
      const q = eIO3(Math.min(1, fall * 1.05)), mx = lerp(it.at[0], it.slot[0], .5);
      x = (1 - q) * (1 - q) * it.at[0] + 2 * (1 - q) * q * mx + q * q * it.slot[0];
      y = fall < .42 ? lerp(it.at[1], apex, eOut3(fall / .42)) : lerp(apex, it.slot[1], eIn2((fall - .42) / .58));
    }
    it.now = fall >= 1 ? "landed" : fall > 0 ? "falling" : "waiting";
    const land = P(t, tDrop + .7, tDrop + 1.05);
    const squash = land > 0 && land < 1 ? Math.sin(Math.PI * land) * .13 : 0;
    const rot = lerp(it.r0, it.rot, Math.max(morph, eOut3(fall)));
    const scl = .3 + .7 * pin;
    st.opacity = (P(t, tPop, tPop + .12) * (1 - out)).toFixed(3);
    st.transform = `translate(${x}px,${y}px) rotate(${rot}deg) scale(${scl * (1 + squash * .6)},${scl * (1 - squash)})`;
    if (it.extra && it.c === "gold") {   // the sparkle, once it has landed on top
      const sp = P(t, tDrop + 1.0, tDrop + 1.5);
      it.extra.style.opacity = sp; it.extra.style.transform = `rotate(${(1 - eOut3(sp)) * 120}deg) scale(${eBack(sp, 3)})`;
    } else if (it.extra) it.extra.style.opacity = P(t, tMorph + .35, tMorph + .65).toFixed(3);   // the cube, as it turns into its box
  });
  const tTag = tTurn + 1.2 + last * .4 + .3 + 1.0;   // once your files have landed on top
  reveal(s.tag, t, tTag, d - .6, .07);
};

    if (!s.states || s.root.style.display === "none") return;
    const w = s.win.getBoundingClientRect();
    s.states.forEach((st, i) => { if (+st.el.style.opacity > .5) { const r = st.el.getBoundingClientRect();
      if (r.left < w.left || r.right > w.right || r.top < w.top || r.bottom > w.bottom - 10) bad.push(`window ${s.i}: state ${i + 1} runs out of the window (${fmt(r)})`); } });
  });
  if (HELP) {
    const p = HF.panel.getBoundingClientRect(), l = HF.list.getBoundingClientRect();
    if (off(p)) bad.push(`the steps panel runs off the frame (${fmt(p)})`);
    SC.forEach(s => { if (s.cap && s.cap.style.display !== "none" && +s.cap.style.opacity > .5 && s.cap.getBoundingClientRect().bottom > l.top - 10)
      bad.push(`${s.image || s.type}: the words in the panel run into the steps`); });
  }
  if (!HELP) SC.forEach(s => {   // the opening's chips and boxes stay on the frame
    if (s.type !== "intro" || s.root.style.display === "none") return;
    s.items.forEach(it => { if (+it.chip.style.opacity > .9) { const r = it.chip.getBoundingClientRect(); if (off(r, 4)) bad.push(`intro: ${it.c} runs off the frame (${fmt(r)})`); } });
    // a box waiting for its turn is never in the way of one that has landed
    const near = (a, b) => a.left < b.right && b.left < a.right && a.top < b.bottom && b.top < a.bottom;
    s.items.filter(a => a.now === "landed").forEach(a => s.items.filter(b => b.now === "waiting").forEach(b => {
      if (near(a.chip.getBoundingClientRect(), b.chip.getBoundingClientRect())) bad.push(`intro: ${b.c}, waiting, is over ${a.c}, landed`); }));
  });
  return bad;
};
</script>
</body>
</html>
