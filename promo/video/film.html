<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Hoard film</title>
<!-- Hoard's videos, drawn here frame by frame: promo/build.py opens this page, calls setup() with a film from
     promo/films/, a language and a shape, then seek(t) for every frame and takes a picture of it. Everything on screen
     is Hoard's own screenshots (scripts/screenshots.py) and shapes drawn in HTML and SVG: nothing generated.
     Two looks: "promo" (dark, moving with the music) and "help" (light and calm: a screen, a pointer, the steps). -->
<style>
@font-face { font-family: "Dela Gothic One"; src: url(../../site/fonts/DelaGothicOne-Regular.woff2) format("woff2"); }
@font-face { font-family: "Zen Maru Gothic"; font-weight: 500; src: url(../../site/fonts/ZenMaruGothic-Medium.woff2) format("woff2"); }
@font-face { font-family: "Zen Maru Gothic"; font-weight: 700; src: url(../../site/fonts/ZenMaruGothic-Bold.woff2) format("woff2"); }
:root {
  --cave: #211C18; --ledge: #2B2520; --stone: #372F28; --seam: #4A4037;
  --bone: #F4EDE3; --dust: #B3A695; --gold: #F0B429; --gold-ink: #2A1D00; --gold-text: #F0B429;
  --display: "Dela Gothic One", "Noto Sans CJK JP", sans-serif;
  --body: "Zen Maru Gothic", "Noto Sans CJK JP", sans-serif;
}
:root[lang=ko] { --display: "Noto Sans CJK KR", sans-serif; --display-weight: 900; --body: "Noto Sans CJK KR", sans-serif; }
/* the help look: Hoard's light theme */
.help { --cave: #EEECE8; --ledge: #FFFFFF; --stone: #E3DFD8; --seam: #D2CCC3; --bone: #211C18; --dust: #6B6157; --gold-text: #8A5F00; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: #000; overflow: hidden; }
#stage { position: relative; overflow: hidden; background: var(--cave); color: var(--bone); font-family: var(--body); font-weight: 500; }
.abs { position: absolute; }
.scene { position: absolute; inset: 0; display: none; }
.glow { position: absolute; width: 1300px; height: 1300px; border-radius: 50%; margin: -650px 0 0 -650px; }
#grain { position: absolute; inset: -64px; background: url(../../build/promo/grain.png); opacity: .07; mix-blend-mode: overlay; }
#vig { position: absolute; inset: 0; background: radial-gradient(ellipse 75% 70% at 50% 50%, rgba(0,0,0,0) 55%, rgba(8,6,5,.55) 100%); }
.help #grain, .help #vig, .help #bg { display: none; }
#fade { position: absolute; inset: 0; background: #000; opacity: 0; }
.help #fade { background: #EEECE8; }
.display { font-family: var(--display); font-weight: var(--display-weight, 400); line-height: 1.1; letter-spacing: -.005em; }
.wm { display: inline-block; overflow: hidden; vertical-align: top; padding: .14em .05em .2em; margin: -.14em -.05em -.2em; }
.wi { display: inline-block; }
.center { left: 0; right: 0; text-align: center; }
.chip { position: absolute; left: 0; top: 0; display: flex; align-items: center; gap: .4em; padding: 0 .85em 0 .66em; height: 1.95em;
  border-radius: 999px; background: var(--ledge); border: 2px solid var(--seam); font-weight: 700; white-space: nowrap;
  box-shadow: 0 24px 50px rgba(0,0,0,.45); transform-origin: 50% 50%; }
.chip i { width: .44em; height: .44em; border-radius: 50%; display: block; flex: none; }
.chip .tag { font-size: .6em; padding: .18em .6em .22em; border-radius: .5em; background: var(--gold); color: var(--gold-ink); letter-spacing: .02em; }
.chip .face { display: flex; align-items: center; gap: .4em; }
.cap .kicker { display: flex; align-items: center; gap: .5em; font-weight: 700; color: var(--gold-text); letter-spacing: .02em; }
.cap .kicker b { display: inline-block; width: .7em; height: .7em; border-radius: .2em; background: var(--gold); }
.cap .title { font-family: var(--display); font-weight: var(--display-weight, 400); line-height: 1.06; }
.cap .body { color: var(--dust); line-height: 1.45; }
.cap .points { display: flex; flex-direction: column; }
.cap .point { display: flex; align-items: flex-start; gap: .55em; font-weight: 700; line-height: 1.3; color: var(--dust); }
.cap .point.on { color: var(--bone); }
.cap .point svg { flex: none; width: 1.2em; height: 1.2em; margin-top: .02em; }
.window { position: absolute; overflow: hidden; border-radius: 22px; border: 2px solid var(--seam); background: var(--ledge);
  box-shadow: 0 40px 100px rgba(0,0,0,.55), 0 10px 30px rgba(0,0,0,.35); }
.help .window { box-shadow: 0 24px 60px rgba(60,40,20,.16), 0 4px 14px rgba(60,40,20,.08); }
.shotimg { position: absolute; left: 0; top: 0; width: 1600px; height: 950px; transform-origin: 0 0; }
.ring { position: absolute; border-radius: 12px; pointer-events: none; }
.lens { position: absolute; overflow: hidden; border-radius: 20px; background: var(--ledge);
  box-shadow: 0 0 0 4px var(--gold), 0 28px 70px rgba(0,0,0,.55); }
.help .lens { box-shadow: 0 0 0 4px var(--gold), 0 20px 50px rgba(60,40,20,.25); }
.lens img { position: absolute; left: 0; top: 0; width: 1600px; height: 950px; transform-origin: 0 0; }
.cursor { position: absolute; left: 0; top: 0; width: 44px; height: 44px; pointer-events: none; }
.ripple { position: absolute; border-radius: 50%; border: 4px solid var(--gold); pointer-events: none; }
.pill { display: inline-block; border-radius: 999px; background: var(--gold); color: var(--gold-ink); font-family: var(--display); font-weight: var(--display-weight, 400); }
.credit { position: absolute; color: rgba(179,166,149,.62); white-space: nowrap; }
.help .credit { color: rgba(107,97,87,.75); }
.panel { position: absolute; background: var(--ledge); border: 2px solid var(--seam); border-radius: 22px; box-shadow: 0 24px 60px rgba(60,40,20,.12); }
.steps { display: flex; flex-direction: column; }
.step { display: flex; align-items: flex-start; gap: .6em; color: var(--dust); font-weight: 700; line-height: 1.3; }
.step .n { flex: none; width: 1.7em; height: 1.7em; border-radius: 50%; border: 2px solid var(--seam); display: flex; align-items: center; justify-content: center;
  font-size: .9em; color: var(--dust); background: var(--ledge); }
.step.now { color: var(--bone); }
.step.now .n { background: var(--gold); border-color: var(--gold); color: var(--gold-ink); }
.step.done .n { background: var(--stone); border-color: var(--stone); color: var(--bone); }
</style>
</head>
<body>
<div id="stage">
  <div id="bg"></div>
  <div id="frame"></div>
  <div id="scenes"></div>
  <div id="chrome"></div>
  <div id="grain"></div>
  <div id="vig"></div>
  <div id="fade"></div>
</div>
<script>
"use strict";
const $ = id => document.getElementById(id);
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const P = (t, a, b) => clamp((t - a) / (b - a));
const lerp = (a, b, p) => a + (b - a) * p;
const eOut3 = p => 1 - Math.pow(1 - p, 3);
const eIn3 = p => p * p * p;
const eIn2 = p => p * p;
const eIO3 = p => p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
const eBack = (p, s = 1.7) => p <= 0 ? 0 : 1 + (s + 1) * Math.pow(p - 1, 3) + s * Math.pow(p - 1, 2);
const spring = (p, k = 3.2, z = 5.5) => p <= 0 ? 0 : p >= 1 ? 1 : 1 - Math.exp(-z * p) * Math.cos(k * Math.PI * p);
const el = (tag, cls, css, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (css) e.style.cssText = css; if (html != null) e.innerHTML = html; return e; };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const hex = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
const mix = (a, b, p) => { const A = hex(a), B = hex(b); return `rgb(${A.map((v, i) => Math.round(lerp(v, B[i], p))).join(",")})`; };
const C = { booth: "#FF6259", gumroad: "#FF8AD8", jinxxy: "#56D1DC", payhip: "#95A0FF", itch: "#7ED67A", gold: "#F0B429", local: "#E8C26A" };
const CAVE = "#211C18", SPARK = "#FFF8E6";
const STORE_NAMES = { booth: "Booth", gumroad: "Gumroad", jinxxy: "Jinxxy", payhip: "Payhip", itch: "itch.io" };
const CHECK = '<svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="19" fill="#F0B429"/><path d="M11.5 20.5l6 6 11-12" fill="none" stroke="#2A1D00" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const STAR = ([x0, y0, k]) => `M${[[0, -5.5], [1.6, -1.6], [5.5, 0], [1.6, 1.6], [0, 5.5], [-1.6, 1.6], [-5.5, 0], [-1.6, -1.6]].map(([x, y]) => `${x0 + x * k} ${y0 + y * k}`).join(" L")}Z`;
const CURSOR = '<svg viewBox="0 0 24 24" width="44" height="44"><path d="M4 2.5l15.5 11.2-6.6 1.1 3.9 6.7-3 1.7-3.9-6.8-5 4.4z" fill="#FFFFFF" stroke="#211C18" stroke-width="1.6" stroke-linejoin="round"/></svg>';

let F, LANG, W, H, PORTRAIT, HELP, BEAT, BAR, SC = [], T_END = 0, VT = 0, HF = null;
const XF = .5;   // a help video's crossfade from one step's screen to the next
window.warnings = [];
// a film's words, in this language (falling back to English)
const T = s => (s && typeof s === "object" && !Array.isArray(s) && "en" in s) ? (s[LANG] ?? s.en) : s;

// ---------------- the Heap: Hoard's logo, six boxes (issue #277)
const HEAP = [  // what, centre x, centre y, size, turn; in the mark's own units. Your own files are the gold box on top.
  ["payhip", 17, 72, 26, -7], ["booth", 44.5, 73.5, 26, 4], ["itch", 72, 72, 26, -5],
  ["jinxxy", 31, 47, 27, -9], ["gumroad", 57.5, 48, 27, 7], ["gold", 44, 24.5, 28, -4, true]];
const HEAP_BOX = [1.2, 8.6, 88.2, 89.4];   // x0, y0, x1, y1 of the mark, outlines included
function tileSVG([c, cx, cy, s, rot, star], i) {
  let out = `<g class="hb" data-i="${i}"><g transform="rotate(${rot} ${cx} ${cy})">` +
    `<rect x="${cx - s / 2}" y="${cy - s / 2}" width="${s}" height="${s}" rx="${s * 7 / 27}" fill="${C[c]}" stroke="${CAVE}" stroke-width="3" stroke-linejoin="round"/>`;
  if (star) { const k = s / 28; out += `<path d="${STAR([cx + 6.5 * k, cy - 3 * k, k])}" fill="${SPARK}"/>`; }
  return out + "</g></g>";
}
function heapSVG(withWord, ink = "#F4EDE3") {
  const [x0, y0, x1, y1] = HEAP_BOX, mw = x1 - x0, mh = y1 - y0;
  if (!withWord) return `<svg viewBox="${x0} ${y0} ${mw} ${mh}" style="overflow:visible;width:100%;height:auto;display:block">${HEAP.map(tileSVG).join("")}</svg>`;
  const sc = 60 / mh, gap = 14, wx = mw * sc + gap - 75.76;
  const words = F.wordmark.map(p => `<path transform="translate(${p[0]} ${p[1]}) scale(${p[2]} -${p[2]})" d="${p[3]}"/>`).join("");
  return `<svg viewBox="0 0 ${wx + 226} 64" style="overflow:visible;width:100%;height:auto;display:block"><g transform="translate(${-x0 * sc} ${2 - y0 * sc}) scale(${sc})">${HEAP.map(tileSVG).join("")}</g>` +
    `<g class="wmk" fill="${ink}" transform="translate(${wx} 0)">${words}</g></svg>`;
}

// ---------------- text
function words(node) {   // each word (in Japanese, each few characters) in a mask of its own, for a reveal
  const walk = n => [...n.childNodes].forEach(c => {
    if (c.nodeType === 3) {
      const parts = LANG === "ja" ? c.textContent.match(/[　-ヿ一-鿿＀-￯]{1,3}|[^　-ヿ一-鿿＀-￯\s]+|\s+/g) || [] : c.textContent.split(/(\s+)/);
      const f = document.createDocumentFragment();
      parts.forEach(p => { if (!p) return; if (/^\s+$/.test(p)) { f.appendChild(document.createTextNode(p)); return; }
        const m = el("span", "wm"), i = el("span", "wi"); i.textContent = p; m.appendChild(i); f.appendChild(m); });
      c.replaceWith(f);
    } else if (c.nodeType === 1) walk(c);
  });
  walk(node); node._w = [...node.querySelectorAll(".wi")]; return node;
}
function reveal(node, t, t0, t1 = null, st = .08, d = .7) {
  node._w.forEach((w, i) => {
    const pi = eOut3(P(t, t0 + i * st, t0 + i * st + d));
    const po = t1 == null ? 0 : eIn3(P(t, t1 + i * st * .4, t1 + i * st * .4 + .35));
    w.style.transform = `translateY(${(1 - pi) * 190 - po * 190}%)`;
    w.style.opacity = pi > 0 && po < 1 ? 1 : 0;
  });
}
function rise(node, t, tin, tout, o = {}) {
  const di = o.di ?? .6, y = o.y ?? 26, x = o.x ?? 0;
  const pi = eOut3(P(t, tin, tin + di)), po = tout == null ? 0 : eIn3(P(t, tout, tout + .35));
  node.style.opacity = (pi * (1 - po)).toFixed(4);
  node.style.transform = `translate(${x * (1 - pi)}px,${y * (1 - pi) - (o.oy ?? 18) * po}px)`;
  return pi * (1 - po);
}
const fadeIO = (t, tin, tout, d = .45) => P(t, tin, tin + d) * (tout == null ? 1 : 1 - P(t, tout, tout + d));

// ---------------- screens: a whole screenshot in a window, a ring round what's meant, a lens on it
function focusList(s) {
  const reg = F.regions[s.image] || {};
  return (s.focus || []).map(f => {
    const o = Array.isArray(f) ? { at: f[0], box: f[1], pad: f[2], lens: f[3] } : f;
    const r = reg[o.box], lname = typeof o.lens === "string" ? o.lens : o.box, lr = reg[lname];
    if (!r) window.warnings.push(`${s.image}: no box for "${o.box}" (${LANG})`);
    if (o.lens !== false && !lr) window.warnings.push(`${s.image}: no box for "${lname}" (${LANG})`);
    // the lens always shows a whole thing on the page (a row, a card, a bar), never a cut through the middle of one
    return { t: o.at * BEAT, r: r || [0, 0, 1600, 950], pad: o.pad ?? 8, click: !!o.click, lens: o.lens !== false,
             lr: lr || r || [0, 0, 1600, 950], lpad: o.lensPad ?? 0 };
  });
}
function screenBuild(s, root, box) {   // box: the window's [left, top, width] on the frame; its height follows the screen's
  const z = box[2] / 1600;
  s.box = [box[0], box[1], box[2], 950 * z]; s.z = z;
  s.focusR = focusList(s);
  const src = `${F.shots}/${s.image}-${F.film.theme || "dark"}${LANG === "en" ? "" : "-" + LANG}.png`;
  s.win = el("div", "window", `left:${s.box[0]}px;top:${s.box[1]}px;width:${s.box[2]}px;height:${s.box[3]}px`,
    `<img class="shotimg" src="${src}" style="transform:scale(${z})"><div class="abs dim" style="inset:0"></div>`);
  s.dim = s.win.querySelector(".dim");
  s.ring = el("div", "ring");
  // the lens: just the element it shows (cut to its edges), on the lens's own plain ground
  s.lens = el("div", "lens", "", `<div class="abs lclip" style="overflow:hidden;border-radius:8px"><img src="${src}"><div class="ring lring"></div></div>`);
  s.lensClip = s.lens.firstChild; s.lensImg = s.lensClip.firstChild; s.lensRing = s.lens.querySelector(".lring");
  root.append(s.win, s.ring, s.lens);
  if (HELP) { s.cursor = el("div", "cursor", "", CURSOR); s.ripple = el("div", "ripple"); root.append(s.ripple, s.cursor); }
}
function focusAt(s, t, moveFor) {   // what's pointed at now, gliding from one to the next
  if (!s.focusR.length) return null;
  let r = s.focusR[0].r.slice(), pad = s.focusR[0].pad, lr = s.focusR[0].lr.slice(), lpad = s.focusR[0].lpad, idx = 0;
  for (let i = 1; i < s.focusR.length; i++) {
    const p = eIO3(P(t, s.focusR[i].t - moveFor, s.focusR[i].t));
    if (p > 0) {
      r = r.map((v, k) => lerp(v, s.focusR[i].r[k], p)); pad = lerp(pad, s.focusR[i].pad, p);
      lr = lr.map((v, k) => lerp(v, s.focusR[i].lr[k], p)); lpad = lerp(lpad, s.focusR[i].lpad, p);
    }
    if (t >= s.focusR[i].t - moveFor / 2) idx = i;
  }
  return { r, pad, lr, lpad, idx };
}
function lensPlace(s, r, pad) {   // the lens: its size, its place on the frame, and how much bigger than the screen it shows
  const [wx, wy, ww, wh] = s.box, z = s.z;
  const rw = r[2] + 2 * pad, rh = r[3] + 2 * pad;
  let L = clamp(Math.min((PORTRAIT ? 640 : 560) / rw, (PORTRAIT ? 260 : 230) / rh), z * 1.6, 1.9);
  L = Math.min(L, (ww * .92 - 40) / rw);
  const lw = rw * L + 40, lh = rh * L + 36;
  const sx = wx + (r[0] + r[2] / 2) * z, sy = wy + (r[1] - pad) * z, sb = wy + (r[1] + r[3] + pad) * z;
  const x = HELP ? clamp(sx - lw / 2, wx + 14, wx + ww - 14 - lw) : clamp(sx - lw / 2, Math.max(24, wx - 30), Math.min(W - 24, wx + ww + 30) - lw);
  const bottom = Math.min(H - (HELP ? 50 : 70), wy + wh + 50);
  let y = sb + 24;
  if (y + lh > bottom) y = sy - 24 - lh;
  if (y < 24) y = clamp(sb + 24, 24, bottom - lh);
  return { x, y, lw, lh, L, cx: sx, cy: (sy + sb) / 2 };
}
function screenDraw(s, t, o) {   // o: { tout, move }
  const f = focusAt(s, t, o.move);
  const z = s.z, [wx, wy] = s.box;
  if (!f) { s.ring.style.opacity = s.lens.style.opacity = 0; s.dim.style.background = "none"; return; }
  const f0 = s.focusR[0].t;
  const on = P(t, f0, f0 + .35) * (1 - P(t, o.tout - .3, o.tout));
  const [x, y, w, h] = [wx + (f.r[0] - f.pad) * z, wy + (f.r[1] - f.pad) * z, (f.r[2] + 2 * f.pad) * z, (f.r[3] + 2 * f.pad) * z];
  s.ring.style.cssText = `left:${x}px;top:${y}px;width:${w}px;height:${h}px;opacity:${on.toFixed(3)};box-shadow:0 0 0 4px var(--gold),0 0 34px 6px rgba(240,180,41,${HELP ? .25 : .45})`;
  s.dim.style.background = `rgba(${HELP ? "40,30,20" : "12,9,7"},${(on * (HELP ? .1 : .3)).toFixed(3)})`;
  // the lens opens after the ring lands, and closes while the ring moves on
  const lp = lensPlace(s, f.lr, f.lpad);
  let lensOn = 0;
  s.focusR.forEach((q, i) => {
    if (!q.lens) return;
    const next = s.focusR[i + 1], a = q.t + .4, b = next ? next.t - o.move : o.tout - .35;
    lensOn = Math.max(lensOn, eBack(P(t, a, a + .5), 1.4) * (1 - eIn3(P(t, b, b + .3))));
  });
  const ls = .6 + .4 * clamp(lensOn, 0, 1.2);
  s.lens.style.cssText = `left:${lp.x}px;top:${lp.y}px;width:${lp.lw}px;height:${lp.lh}px;opacity:${clamp(lensOn * 1.5).toFixed(3)};` +
    `transform-origin:${lp.cx - lp.x}px ${lp.cy - lp.y}px;transform:scale(${ls.toFixed(4)})`;
  s.lensClip.style.left = "20px"; s.lensClip.style.top = "18px";
  s.lensClip.style.width = (lp.lw - 40) + "px"; s.lensClip.style.height = (lp.lh - 36) + "px";
  const ox = -(f.lr[0] - f.lpad) * lp.L, oy = -(f.lr[1] - f.lpad) * lp.L;
  s.lensImg.style.transform = `translate(${ox}px,${oy}px) scale(${lp.L})`;
  const sameBox = f.r.every((v, k) => Math.abs(v - f.lr[k]) < 1);   // a ring inside the lens, when it shows more than what's meant
  s.lensRing.style.cssText = `left:${ox + (f.r[0] - f.pad) * lp.L}px;top:${oy + (f.r[1] - f.pad) * lp.L}px;width:${(f.r[2] + 2 * f.pad) * lp.L}px;` +
    `height:${(f.r[3] + 2 * f.pad) * lp.L}px;opacity:${sameBox ? 0 : 1};box-shadow:0 0 0 3px var(--gold)`;
  if (HELP) {   // the pointer glides to what's clicked, and clicks it
    const clicks = s.focusR.filter(q => q.click);
    let px = wx + s.box[2] * .62, py = wy + s.box[3] * .82, show = 0, click = 0, cx = 0, cy = 0, press = 0;
    clicks.forEach(q => {
      const tx = wx + (q.r[0] + q.r[2] / 2) * z, ty = wy + (q.r[1] + q.r[3] * .6) * z;
      const m = eIO3(P(t, q.t - 1.3, q.t - .15));
      px = lerp(px, tx, m); py = lerp(py, ty, m);
      show = Math.max(show, P(t, q.t - 1.6, q.t - 1.3));
      press = Math.max(press, Math.sin(Math.PI * P(t, q.t - .1, q.t + .15)));
      const c = P(t, q.t - .1, q.t + .6); if (c > 0 && c < 1) { click = c; cx = tx; cy = ty; }
    });
    show *= 1 - P(t, o.tout - .4, o.tout);
    s.cursor.style.opacity = show.toFixed(3);
    s.cursor.style.transform = `translate(${px - 6}px,${py - 4}px) scale(${1 - .12 * press})`;
    const rr = 16 + 46 * eOut3(click);
    s.ripple.style.cssText = `left:${cx - rr}px;top:${cy - rr}px;width:${rr * 2}px;height:${rr * 2}px;opacity:${click > 0 ? (1 - click).toFixed(3) : 0}`;
  }
}

// ---------------- the promo's scenes
const BUILD = {}, DRAW = {};
const CHIP_ORDER = ["booth", "gumroad", "jinxxy", "payhip", "itch", "gold"];   // the order they pop up in

// The opening: the stores one by one, then your own files; each turns into its box and drops into the Heap.
BUILD.intro = (s, root) => {
  const tx = T(s.text), fs = PORTRAIT ? 100 : 112;
  s.l1 = words(el("div", "abs center display", `top:${PORTRAIT ? 380 : 140}px;font-size:${fs}px;padding:0 50px`, esc(tx.stores)));
  s.l2 = words(el("div", "abs center display", `top:${PORTRAIT ? 520 : 275}px;font-size:${fs}px;padding:0 50px;color:var(--gold)`, esc(tx.local)));
  s.tag = words(el("div", "abs center display", `top:${PORTRAIT ? 1230 : 770}px;font-size:${PORTRAIT ? 70 : 60}px;padding:0 70px`, esc(tx.tagline)));
  root.append(s.l1, s.l2, s.tag);
  const size = PORTRAIT ? 560 : 500, [x0, y0, x1, y1] = HEAP_BOX, k = size / (y1 - y0);
  const left = (W - (x1 - x0) * k) / 2, top = PORTRAIT ? 580 : 210;
  s.k = k;
  const chipAt = PORTRAIT ? [[300, 900], [780, 1010], [270, 1170], [800, 1290], [500, 1430], [540, 1640]]
                          : [[420, 560], [930, 650], [1460, 545], [640, 820], [1250, 840], [960, 965]];
  s.items = HEAP.map(([c, cx, cy, sz, rot, star]) => {
    const i = CHIP_ORDER.indexOf(c);
    const chip = el("div", "chip", `font-size:${PORTRAIT ? 50 : 46}px`,
      `<span class="face"><i style="background:${C[c]};box-shadow:0 0 0 .15em ${C[c]}33"></i>${esc(c === "gold" ? tx.chip : STORE_NAMES[c])}` +
      (c === "gold" ? `<span class="tag">${esc(tx.tag)}</span>` : "") + `</span>`);
    root.appendChild(chip);
    const it = { c, i, chip, face: chip.firstChild, at: chipAt[i], r0: [-6, 4, -5, 5, -3, 3][i], rot,
      slot: [left + (cx - x0) * k, top + (cy - y0) * k], size: (sz + 3) * k, radius: (sz * 7 / 27 + 1.5) * k };
    if (star) {
      it.spark = el("div", "abs", "inset:0;opacity:0", `<svg viewBox="0 0 28 28" style="width:100%;height:100%;overflow:visible"><path d="${STAR([14 + 6.5, 14 - 3, 1])}" fill="${SPARK}"/></svg>`);
      chip.appendChild(it.spark);
    }
    return it;
  });
  s.drop = ["payhip", "booth", "itch", "jinxxy", "gumroad", "gold"];   // the bottom row first, your files last, on top
};
DRAW.intro = (s, t) => {
  const d = s.dur, B = BEAT;
  const tTurn = 8 * B;                                  // bar 2: the words go and the chips turn into boxes
  reveal(s.l1, t, .1, tTurn - .6);
  reveal(s.l2, t, 4.8 * B, tTurn - .6);
  const out = eIn3(P(t, d - .45, d));
  s.items.forEach(it => {
    const k = s.drop.indexOf(it.c);
    const tPop = it.c === "gold" ? 5.4 * B : (.8 + it.i * .75) * B;
    const pin = eBack(P(t, tPop, tPop + .5), 2.2);
    const tMorph = tTurn + it.i * .09, morph = eIO3(P(t, tMorph, tMorph + .65));
    const tDrop = tTurn + 1.2 + k * .45 + (it.c === "gold" ? .35 : 0), fall = P(t, tDrop, tDrop + .7);
    const cw = it.chip.offsetWidth || 1, ch = it.chip.offsetHeight || 1;
    if (!it.cw) { it.cw = cw; it.ch = ch; }             // the chip's own size, before it starts to turn
    const w = lerp(it.cw, it.size, morph), h = lerp(it.ch, it.size, morph);
    const st = it.chip.style;
    st.width = w + "px"; st.height = h + "px"; st.marginLeft = (-w / 2) + "px"; st.marginTop = (-h / 2) + "px";
    st.padding = morph > 0 ? "0" : ""; st.justifyContent = "center";
    st.borderRadius = lerp(it.ch / 2, it.radius, morph) + "px";
    st.background = morph > 0 ? mix("#2B2520", C[it.c], morph) : "";
    st.borderColor = morph > 0 ? mix("#4A4037", CAVE, morph) : "";
    st.borderWidth = lerp(2, 3 * s.k, morph) + "px";
    st.boxShadow = `0 ${24 - 14 * morph}px ${50 - 20 * morph}px rgba(0,0,0,${.45 - .15 * morph})`;
    it.face.style.opacity = (1 - P(t, tMorph, tMorph + .3)).toFixed(3);
    it.face.style.display = morph >= .5 ? "none" : "flex";
    // where it is: where it popped up, bobbing; then up and over, and down into its place in the Heap
    const bob = Math.sin(VT * 2.2 + it.i * 1.7) * 7 * (1 - P(t, tDrop - .2, tDrop));
    let x = it.at[0], y = it.at[1] + bob;
    if (fall > 0) {
      const apex = Math.max(Math.min(it.at[1], it.slot[1]) - (PORTRAIT ? 360 : 280), it.size / 2 + 40);   // (never off the top)
      const q = eIO3(Math.min(1, fall * 1.05)), mx = lerp(it.at[0], it.slot[0], .5);
      x = (1 - q) * (1 - q) * it.at[0] + 2 * (1 - q) * q * mx + q * q * it.slot[0];
      y = fall < .42 ? lerp(it.at[1], apex, eOut3(fall / .42)) : lerp(apex, it.slot[1], eIn2((fall - .42) / .58));
    }
    const land = P(t, tDrop + .7, tDrop + 1.05);
    const squash = land > 0 && land < 1 ? Math.sin(Math.PI * land) * .13 : 0;
    const rot = lerp(it.r0, it.rot, Math.max(morph, eOut3(fall)));
    const scl = .3 + .7 * pin;
    st.opacity = (P(t, tPop, tPop + .12) * (1 - out)).toFixed(3);
    st.transform = `translate(${x}px,${y}px) rotate(${rot}deg) scale(${scl * (1 + squash * .6)},${scl * (1 - squash)})`;
    if (it.spark) { const sp = P(t, tDrop + 1.0, tDrop + 1.5); it.spark.style.opacity = sp; it.spark.style.transform = `rotate(${(1 - eOut3(sp)) * 120}deg) scale(${eBack(sp, 3)})`; }
  });
  const tTag = tTurn + 1.2 + 5 * .45 + .35 + 1.0;   // once your files have landed on top
  reveal(s.tag, t, tTag, d - .6, .07);
};

// A screen of Hoard's beside its words (under them, in portrait), whole: a lens shows what's meant up close.
BUILD.shot = (s, root) => {
  const tx = T(s.text), right = s.side !== "right";
  screenBuild(s, root, PORTRAIT ? [40, 240, W - 80] : [right ? 690 : 90, 0, 1140]);
  if (!PORTRAIT) { s.box[1] = (H - s.box[3]) / 2 + 10; s.win.style.top = s.box[1] + "px"; }
  const capW = PORTRAIT ? W - 120 : 500;
  const fsT = PORTRAIT ? 88 : 72, fsB = PORTRAIT ? 38 : 32, fsK = PORTRAIT ? 32 : 27, fsP = PORTRAIT ? 36 : 30;
  s.cap = el("div", "abs cap", `width:${capW}px`);
  s.k = el("div", "kicker", `font-size:${fsK}px`, `<b></b>${esc(tx.kicker || "")}`);
  s.t = words(el("div", "title", `font-size:${fsT}px;margin-top:${fsK * .7}px`, esc(tx.title)));
  s.b = el("div", "body", `font-size:${fsB}px;margin-top:${fsB * .7}px`, esc(tx.body || ""));
  s.ps = el("div", "points", `gap:${fsP * .5}px;margin-top:${fsP}px`);
  s.pts = (tx.points || []).map(p => { const n = el("div", "point", `font-size:${fsP}px`, CHECK + `<span>${esc(p)}</span>`); s.ps.appendChild(n); return n; });
  s.cap.append(s.k, s.t, s.b, s.ps);
  root.appendChild(s.cap);
  if (PORTRAIT) { s.cap.style.left = "60px"; s.cap.style.top = (s.box[1] + s.box[3] + 330) + "px"; }
  else s.cap.style.left = (right ? 120 : W - 120 - capW) + "px";
};
DRAW.shot = (s, t) => {
  const d = s.dur, pin = eOut3(P(t, .02, .9)), out = eIn3(P(t, d - .5, d - .05)), right = s.side !== "right";
  s.win.style.opacity = (P(t, 0, .4) * (1 - out)).toFixed(3);
  s.win.style.transform = PORTRAIT ? `translateY(${60 * (1 - pin) - 30 * out}px)` : `translateX(${(right ? 1 : -1) * (120 * (1 - pin) - 60 * out)}px)`;
  screenDraw(s, t, { tout: d - .5, move: .9 });
  if (!PORTRAIT) s.cap.style.top = Math.max(150, (H - s.cap.offsetHeight) / 2 + 10) + "px";
  const tout = d - .55;
  rise(s.k, t, .25, tout, { y: 22 });
  reveal(s.t, t, .35, tout);
  rise(s.b, t, .75, tout);
  const pts = s.pts.map((_, i) => s.focusR[i] ? s.focusR[i].t : (2 + i) * BEAT);
  s.pts.forEach((p, i) => { rise(p, t, pts[i], tout, { x: right ? -26 : 26, y: 0, di: .5 }); p.classList.toggle("on", t >= pts[i] && (i === s.pts.length - 1 || t < pts[i + 1])); });
};

DRAW.end = (s, t) => {
  const order = [1, 0, 2, 3, 4, 5];
  s.boxes.forEach((b, i) => { const t0 = .02 + order.indexOf(i) * .08, p = spring(P(t, t0, t0 + .8)); b.style.opacity = P(t, t0, t0 + .05); b.style.transform = `translate(0,${-18 * (1 - p)}px)`; });
  const wm = s.logo.querySelector(".wmk"); wm.style.opacity = P(t, .4, .8); wm.style.transform = `translateY(${8 * (1 - eOut3(P(t, .4, .9)))}px)`;
  reveal(s.l1, t, .6);
  rise(s.l2, t, 1.1, null, { y: 18 });
  const up = eBack(P(t, 1.5, 2.0), 2); s.l3.style.transform = `scale(${.6 + .4 * up})`; s.l3.style.opacity = P(t, 1.5, 1.65);
  rise(s.l4, t, 2.0, null, { y: 14 });
  rise(s.l5, t, 2.3, null, { y: 8 });

// ---------------- the help videos: Hoard's light theme, a header, the screen, and the steps beside it
function helpFrame() {   // what stays on screen the whole video: the logo, the problem, and the steps
  const tx = T(F.film.text);
  const head = el("div", "abs", `left:${PORTRAIT ? 50 : 80}px;right:${PORTRAIT ? 50 : 80}px;top:${PORTRAIT ? 70 : 42}px;height:64px;display:flex;align-items:center;gap:26px`);
  head.append(el("div", "", `width:${PORTRAIT ? 190 : 176}px;flex:none`, heapSVG(true, "#211C18")),
              el("div", "", "width:2px;height:40px;background:var(--seam);flex:none"),
              el("div", "", `font-size:${PORTRAIT ? 30 : 28}px;font-weight:700;color:var(--dust);white-space:nowrap;overflow:hidden;text-overflow:ellipsis`,
                 `${esc(tx.label)} <span style="color:var(--bone)">${esc(tx.problem)}</span>`));
  const pw = PORTRAIT ? W - 80 : 500, pl = PORTRAIT ? 40 : W - 80 - pw, pt = PORTRAIT ? 1100 : 150;
  const ph = PORTRAIT ? 720 : 1240 / 1600 * 950;
  const pad = PORTRAIT ? 44 : 36, fs = PORTRAIT ? 36 : 29;
  const panel = el("div", "panel", `left:${pl}px;top:${pt}px;width:${pw}px;height:${ph}px`);
  const about = el("div", "abs", `left:${pad}px;right:${pad}px;top:${pad}px`);
  const list = el("div", "abs steps", `left:${pad}px;right:${pad}px;bottom:${pad}px;gap:${fs * .6}px`);
  list.append(el("div", "", `font-size:${fs * .8}px;font-weight:700;color:var(--dust)`, esc(tx.stepsLabel || "")));
  const rows = (tx.steps || []).map((st, i) => { const r = el("div", "step", `font-size:${fs}px`, `<span class="n">${i + 1}</span><span>${esc(st)}</span>`); list.appendChild(r); return r; });
  panel.append(about, list);
  $("frame").append(head, panel);
  return { head, panel, about, rows, list };
}
function helpAbout(s, tx) {   // one scene's words, at the top of the panel
  const fsK = PORTRAIT ? 30 : 24, fsT = PORTRAIT ? 62 : 46, fsB = PORTRAIT ? 34 : 27;
  s.cap = el("div", "abs cap", "left:0;right:0;top:0;opacity:0;display:none");
  s.cap.append(el("div", "kicker", `font-size:${fsK}px`, `<b></b>${esc(tx.kicker || "")}`),
               el("div", "title", `font-size:${fsT}px;margin-top:${fsK * .6}px`, esc(tx.title)),
               el("div", "body", `font-size:${fsB}px;margin-top:${fsB * .6}px`, esc(tx.body || "")));
  HF.about.appendChild(s.cap);
}
function helpPanelDraw(s, t) {
  s.cap.style.opacity = (t < 0 ? 0 : fadeIO(t, .05, s.dur - .4, .35)).toFixed(3);
  s.cap.style.transform = `translateY(${10 * (1 - eOut3(P(t, .2, .7)))}px)`;
  HF.rows.forEach((r, i) => { r.classList.toggle("now", s.step === i + 1); r.classList.toggle("done", typeof s.step === "number" && i + 1 < s.step); });
}
const HELP_BOX = () => PORTRAIT ? [40, 190, W - 80] : [80, 150, 1240];
BUILD.hshot = (s, root) => { screenBuild(s, root, HELP_BOX()); helpAbout(s, T(s.text)); };
const helpIn = s => s.i > 0 && ["hshot", "hwindow"].includes(SC[s.i - 1].type) ? -XF : 0;
const helpOut = s => SC[s.i + 1] && ["hshot", "hwindow"].includes(SC[s.i + 1].type) ? s.dur : s.dur - .45;
DRAW.hshot = (s, t) => {
  s.win.style.opacity = fadeIO(t, helpIn(s), helpOut(s) - (helpOut(s) === s.dur ? XF : 0), helpIn(s) ? XF : .45).toFixed(3);
  screenDraw(s, t, { tout: s.dur - .45, move: 1.1 });
  helpPanelDraw(s, t);
};
// A step outside Hoard's pages (a store's sign-in window): a plain drawing of a window, never the store's own page.
BUILD.hwindow = (s, root) => {
  const tx = T(s.text), box = HELP_BOX(), ww = box[2], wh = ww * 950 / 1600;
  s.box = [box[0], box[1], ww, wh];
  s.win = el("div", "window", `left:${box[0]}px;top:${box[1]}px;width:${ww}px;height:${wh}px;background:#F7F5F1`);
  const fw = Math.min(520, ww - 200), mid = wh / 2 - 30;
  const bar = top => `<div class="abs" style="left:50%;top:${top}px;width:${fw}px;height:54px;margin-left:${-fw / 2}px;border-radius:12px;background:#FFFFFF;border:2px solid #D2CCC3"></div>`;
  s.win.innerHTML = `<div class="abs" style="left:0;right:0;top:0;height:66px;background:#FFFFFF;border-bottom:2px solid #E3DFD8"></div>` +
    `<div class="abs" style="left:26px;right:26px;top:13px;height:40px;border-radius:20px;background:#EEECE8;display:flex;align-items:center;gap:10px;padding:0 18px;font-size:22px;color:#6B6157">` +
    `<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#6B6157" stroke-width="2.2"><rect x="5" y="10" width="14" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>${esc(s.address || "")}</div>` +
    `<div class="abs wf" style="inset:0">${bar(mid - 100)}${bar(mid - 26)}<div class="abs wbtn" style="left:50%;top:${mid + 56}px;width:${fw}px;height:56px;margin-left:${-fw / 2}px;border-radius:12px;background:#D2CCC3"></div></div>` +
    `<div class="abs wok" style="left:50%;top:${mid - 70}px;width:140px;height:140px;margin-left:-70px;opacity:0">${CHECK}</div>` +
    `<div class="abs wnote center" style="top:${mid + 100}px;font-size:${PORTRAIT ? 30 : 27}px;color:#6B6157;opacity:0;padding:0 40px">${esc(tx.note || "")}</div>`;
  s.wf = s.win.querySelector(".wf"); s.wok = s.win.querySelector(".wok"); s.wbtn = s.win.querySelector(".wbtn"); s.wnote = s.win.querySelector(".wnote");
  s.wok.firstChild.style.cssText = "width:100%;height:100%";
  s.btn = [box[0] + ww / 2, box[1] + mid + 84];
  s.cursor = el("div", "cursor", "", CURSOR); s.ripple = el("div", "ripple");
  root.append(s.win, s.ripple, s.cursor);
  helpAbout(s, tx);
};
DRAW.hwindow = (s, t) => {
  const d = s.dur, press = .5 * d, done = press + 1.0;
  s.win.style.opacity = fadeIO(t, helpIn(s), helpOut(s) - (helpOut(s) === s.dur ? XF : 0), helpIn(s) ? XF : .45).toFixed(3);
  s.wf.style.opacity = (1 - P(t, done - .1, done + .3)).toFixed(3);
  s.wbtn.style.background = t > press - .05 && t < done ? "#F0B429" : "#D2CCC3";
  const ok = eBack(P(t, done, done + .55), 2.2);
  s.wok.style.opacity = P(t, done, done + .12); s.wok.style.transform = `scale(${.4 + .6 * ok})`;
  s.wnote.style.opacity = fadeIO(t, done + .4, d - .45).toFixed(3);
  const [bx, by] = s.btn, m = eIO3(P(t, press - 1.4, press - .15));
  const px = lerp(s.box[0] + s.box[2] * .7, bx + 60, m), py = lerp(s.box[1] + s.box[3] * .84, by, m);
  s.cursor.style.opacity = (P(t, press - 1.7, press - 1.4) * (1 - P(t, done + .2, done + .5))).toFixed(3);
  s.cursor.style.transform = `translate(${px - 6}px,${py - 4}px) scale(${1 - .12 * Math.sin(Math.PI * P(t, press - .1, press + .15))})`;
  const c = P(t, press - .1, press + .6), rr = 16 + 46 * eOut3(c);
  s.ripple.style.cssText = `left:${px - rr}px;top:${py - rr}px;width:${rr * 2}px;height:${rr * 2}px;opacity:${c > 0 && c < 1 ? (1 - c).toFixed(3) : 0}`;
  helpPanelDraw(s, t);
};

// ---------------- the whole film
window.setup = function (cfg) {
  F = cfg; LANG = cfg.lang; PORTRAIT = cfg.shape === "portrait"; HELP = cfg.film.style === "help";
  document.documentElement.lang = LANG;
  W = PORTRAIT ? 1080 : 1920; H = PORTRAIT ? 1920 : 1080;
  BEAT = 60 / cfg.film.bpm; BAR = 4 * BEAT;
  const stage = $("stage"); stage.style.width = W + "px"; stage.style.height = H + "px";
  stage.classList.toggle("help", HELP);
  document.body.style.width = W + "px"; document.body.style.height = H + "px";
  [["gold", .2, .16, .83], ["gumroad", .16, .86, .91], ["jinxxy", .14, .78, .11], ["booth", .15, .1, .19], ["payhip", .16, .5, 1.02]].forEach(([c, a, x, y], i) => {
    const g = el("div", "glow", `background:radial-gradient(circle,${C[c]} 0%,rgba(0,0,0,0) 62%)`); g._a = a; g._x = x * W; g._y = y * H; g._f = [.31, .23, .19, .27, .21][i]; g._ph = [.9, 2.1, 3.7, 5.2, 1.3][i];
    $("bg").appendChild(g);
  });
  if (HELP) HF = helpFrame();

// what's wrong with this frame, if anything: something off the edge, a lens over what it shows, words over the screen
window.checkFrame = function () {
  const bad = [], fmt = r => `${Math.round(r.left)},${Math.round(r.top)} to ${Math.round(r.right)},${Math.round(r.bottom)}`;
  const off = (r, m = 8) => r.left < m || r.top < m || r.right > W - m || r.bottom > H - m;
  const over = (a, b) => a.left < b.right && b.left < a.right && a.top < b.bottom && b.top < a.bottom;
  SC.forEach(s => {
    if (s.root.style.display === "none" || !s.win) return;
    const w = s.win.getBoundingClientRect();
    if (+s.win.style.opacity > .9 && off(w)) bad.push(`${s.image || s.type}: the screen runs off the frame (${fmt(w)})`);
    if (s.lens && +s.lens.style.opacity > .9) {
      const l = s.lens.getBoundingClientRect(), r = s.ring.getBoundingClientRect();
      if (off(l)) bad.push(`${s.image}: the lens runs off the frame (${fmt(l)})`);
      if (over(l, r)) bad.push(`${s.image}: the lens covers what it shows (${fmt(l)} over ${fmt(r)})`);
      if (!HELP && s.cap && over(l, s.cap.getBoundingClientRect())) bad.push(`${s.image}: the lens covers the words`);
      if (HELP && over(l, HF.panel.getBoundingClientRect())) bad.push(`${s.image}: the lens covers the steps`);
    }
    if (s.ring && +s.ring.style.opacity > .5) {
      const r = s.ring.getBoundingClientRect();
      if (r.left < w.left - 6 || r.top < w.top - 6 || r.right > w.right + 6 || r.bottom > w.bottom + 6) bad.push(`${s.image}: the ring runs out of the screen (${fmt(r)})`);
    }
    if (!HELP && s.cap && +s.win.style.opacity > .9) {
      const c = s.cap.getBoundingClientRect();
      if (off(c)) bad.push(`${s.image}: the words run off the frame (${fmt(c)})`);
      if (over(c, w)) bad.push(`${s.image}: the words run into the screen`);
    }
  });
  if (HELP) {
    const p = HF.panel.getBoundingClientRect(), l = HF.list.getBoundingClientRect();
    if (off(p)) bad.push(`the steps panel runs off the frame (${fmt(p)})`);
    SC.forEach(s => { if (s.cap && s.cap.style.display !== "none" && +s.cap.style.opacity > .5 && s.cap.getBoundingClientRect().bottom > l.top - 10)
      bad.push(`${s.image || s.type}: the words in the panel run into the steps`); });
  }
  if (!HELP) SC.forEach(s => {   // the opening's chips and boxes stay on the frame
    if (s.type !== "intro" || s.root.style.display === "none") return;
    s.items.forEach(it => { if (+it.chip.style.opacity > .9) { const r = it.chip.getBoundingClientRect(); if (off(r, 4)) bad.push(`intro: ${it.c} runs off the frame (${fmt(r)})`); } });
  });
  return bad;
};
